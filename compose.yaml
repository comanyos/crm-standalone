name: independent-crm

services:
  crm-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CRM_DB_ADMIN_PASSWORD:-crm_admin_dev}
      POSTGRES_DB: crm
    ports:
      - "15433:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "14222:4222"
      - "18222:8222"

  # --- Disposable integration-test databases (opt-in: `--profile test`) ---
  #
  # Separate from crm-postgres above: different port, no named volume (tmpfs —
  # data lives only for the container's lifetime), and never started by a
  # plain `make up`. Integration tests must run here, never against the
  # development database.
  crm-postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: crm_admin_test
      POSTGRES_DB: crm
    volumes:
      - ./services/crm-api/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "15533:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies CRM SQL migrations on every `make up`, recording each successful
  # version. This replaces Postgres initdb hooks for the main development
  # database: initdb hooks run only once and cannot apply a new migration to
  # an existing named volume.
  crm-migrate:
    image: postgres:17-alpine
    command: ["/bin/sh", "/scripts/migrate.sh"]
    environment:
      PGHOST: crm-postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${CRM_DB_ADMIN_PASSWORD:-crm_admin_dev}
      PGDATABASE: crm
    volumes:
      - ./services/crm-api/migrations:/migrations:ro
      - ./services/crm-api/scripts/migrate.sh:/scripts/migrate.sh:ro
    depends_on:
      crm-postgres:
        condition: service_healthy
    restart: "no"

  crm-api:
    build:
      context: ./services/crm-api
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      MODE: standalone
      CRM_ADDR: ":9431"
      DATABASE_URL: postgres://crm_app:${CRM_DB_APP_PASSWORD:-crm_app}@crm-postgres:5432/crm?sslmode=disable
      OUTBOX_DRAIN_DATABASE_URL: postgres://crm_drain:${CRM_DB_DRAIN_PASSWORD:-crm_drain}@crm-postgres:5432/crm?sslmode=disable
      # Empty only in local Compose: /metrics is intentionally local/internal
      # unauthenticated there. Staging/production requires CRM_METRICS_TOKEN.
      CRM_METRICS_TOKEN: ${CRM_METRICS_TOKEN:-}
      NATS_URL: nats://nats:4222
      # Full credentialed CRM access belongs only to the authenticated app.
      CORS_ALLOWED_ORIGINS: ${CRM_CORS_ALLOWED_ORIGINS:-${CRM_WEB_ORIGIN:-http://localhost:3003}}
      # The public marketing site can reach only the allowlisted auth surface
      # (capabilities, Google start, and email request/verify).
      AUTH_CORS_ALLOWED_ORIGINS: ${AUTH_CORS_ALLOWED_ORIGINS:-http://localhost:4173,http://127.0.0.1:4173}
      OTP_PEPPER: ${OTP_PEPPER:-savvy-crm-development-only-otp-pepper-change-me}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-720h}
      AUTH_OTP_TTL: ${AUTH_OTP_TTL:-10m}
      # Deterministic six-digit code for automated APP_ENV=test journeys only.
      AUTH_DEV_OTP: ${AUTH_DEV_OTP:-}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-savvy_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_LOGIN_SUCCESS_URL: ${AUTH_LOGIN_SUCCESS_URL:-${CRM_WEB_ORIGIN:-http://localhost:3003}}
      AUTH_JOIN_RESULT_URL: ${AUTH_JOIN_RESULT_URL:-http://localhost:4173/?auth=signup#top}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_ORG_NAME: ${AUTH_BOOTSTRAP_ORG_NAME:-}
      AUTH_BOOTSTRAP_ORG_ID: ${AUTH_BOOTSTRAP_ORG_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-Savvy CRM <support@savvyadvi.com>}"
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_REQUIRE_STARTTLS: ${SMTP_REQUIRE_STARTTLS:-true}
      # Sign-in identity OAuth. These credentials/scopes are intentionally
      # separate from the Gmail and Calendar integration below.
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      # Keep this empty with the client id/secret. Supplying only a redirect
      # URL is a partial OAuth configuration and the API correctly refuses it.
      AUTH_GOOGLE_REDIRECT_URL: ${AUTH_GOOGLE_REDIRECT_URL:-}
      # Inbound lead capture (docs/LEAD_CAPTURE.md). Unset means the feature
      # is off and the route is not registered — there is deliberately no
      # unsigned mode, so a deployment either has a key or has no endpoint.
      LEAD_CAPTURE_SECRET_KEY: ${LEAD_CAPTURE_SECRET_KEY:-}
      # Independent key for outbound workflow endpoint signing secrets.
      WORKFLOW_WEBHOOK_SECRET_KEY: ${WORKFLOW_WEBHOOK_SECRET_KEY:-}
      # Native Facebook + Instagram Lead Ads. The API enables the connector
      # only when this complete group is supplied; all-empty is safely off.
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_OAUTH_REDIRECT_URL: ${META_OAUTH_REDIRECT_URL:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_TOKEN_KEY: ${META_TOKEN_KEY:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v25.0}
      # This API's own public origin, used only to assemble the delivery URL
      # an administrator hands to a third party. Configured rather than read
      # from a Host header, since that value gets pasted into somebody's
      # integration settings.
      CRM_PUBLIC_BASE_URL: ${CRM_PUBLIC_URL:-http://localhost:19431}
    ports:
      - "19431:9431"
    depends_on:
      crm-postgres:
        condition: service_healthy
      crm-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    restart: on-failure

  # The CRM browser app is a static SPA. Authentication and session renewal
  # are same-product API calls; no separate identity-provider runtime exists.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CRM_API_URL: ${CRM_PUBLIC_URL:-http://localhost:19431}
        VITE_CRM_AUTH_PORTAL_URL: ${CRM_AUTH_PORTAL_URL:-http://localhost:4173/?auth=login#top}
    ports:
      - "${CRM_WEB_PORT:-3003}:8080"
    depends_on:
      crm-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  crm_pgdata:

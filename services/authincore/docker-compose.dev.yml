# Lightweight dev stack — just the backing services.
# Run the Go server directly with: go run ./cmd/authincore
# Run the admin UI with: cd admin-ui && npm run dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authincore
      POSTGRES_PASSWORD: authincore
      POSTGRES_DB: authincore
    ports:
      - "5432:5432"
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authincore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_dev_data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authincore
      POSTGRES_PASSWORD: authincore
      POSTGRES_DB: authincore
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authincore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"    # monitoring
    command: ["-js"]   # enable JetStream

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://authincore:authincore@postgres:5432/authincore?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  authincore:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://authincore:authincore@postgres:5432/authincore?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      PORT: 8080
      ISSUER: http://localhost:8080
      RSA_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_KEY_ID: dev-k1
      REQUIRE_PERSISTENT_SIGNING_KEY: "true"
    secrets:
      - jwt_private_key
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - authincore

  outpost:
    build:
      context: .
      dockerfile: Dockerfile.outpost
    environment:
      AUTHINCORE_URL: http://authincore:8080
      OUTPOST_TOKEN_FILE: /run/secrets/outpost_token
      OUTPOST_PORT: 9090
    secrets:
      - outpost_token
    ports:
      - "9090:9090"
    depends_on:
      - authincore

volumes:
  pg_data:

secrets:
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_FILE:?set JWT_PRIVATE_KEY_FILE to a development RSA private key}
  outpost_token:
    file: ${OUTPOST_TOKEN_FILE:?set OUTPOST_TOKEN_FILE to an outpost token file}

version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosec
    - exhaustive
    - gocritic
    - revive
  disable:
    - wsl
    - gochecknoglobals
  exclusions:
    rules:
      # Test files: allow longer functions, unexported test helpers, gosec suppressions.
      - path: "_test\\.go"
        linters:
          - gocritic
          - revive
          - gosec
      # Migration files are not required to have full error handling.
      - path: "migrations/"
        linters:
          - errcheck

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment   # too noisy for IAM structs with many bool fields

  errcheck:
    check-type-assertions: true
    check-blank: true

  staticcheck:
    checks:
      - all
      - "-SA1019"   # allow deprecated API usage during migration

  gosec:
    excludes:
      - G404   # weak random — math/rand use is intentional in non-security paths

  exhaustive:
    default-signifies-exhaustive: true

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam          # accept-by-value patterns are intentional here
      - unnamedResult

  revive:
    rules:
      - name: exported
        severity: warning
      - name: error-return
        severity: warning
      - name: blank-imports
        severity: error
      - name: context-as-argument
        severity: error
      - name: unused-parameter
        severity: warning

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

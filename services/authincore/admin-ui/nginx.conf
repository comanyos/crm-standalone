server {
    listen 3001;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend
    location /api/ {
        proxy_pass http://authincore:8080;
		# Preserve the public local AuthinCore authority so tenant resolution
		# selects the same organization as direct localhost API requests.
		proxy_set_header Host localhost:18080;
		proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /oauth2/ {
        proxy_pass http://authincore:8080;
		proxy_set_header Host localhost:18080;
		proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /self-service/ {
        proxy_pass http://authincore:8080;
		proxy_set_header Host localhost:18080;
		proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "authincore"
version = "1.0.0"
description = "JWT validation and framework helpers for AuthinCore"
requires-python = ">=3.10"
dependencies = ["PyJWT[crypto]>=2.10.1,<3"]
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]

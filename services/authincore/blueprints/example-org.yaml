version: "1"
metadata:
  name: example-org-bootstrap
  labels:
    env: dev

entries:
  - model: authincore/org
    id: example-org
    state: present
    attrs:
      name: "Example Organisation"
      primary_domain: "example.localhost"

  - model: authincore/identity-schema
    id: user-v1
    state: present
    attrs:
      schema: |
        {
          "$id": "user-v1",
          "$schema": "http://json-schema.org/draft-07/schema#",
          "title": "User",
          "type": "object",
          "properties": {
            "email": { "type": "string", "format": "email" },
            "name":  { "type": "string", "minLength": 1 }
          },
          "required": ["email"]
        }

  - model: authincore/project
    id: main-project
    state: present
    attrs:
      name: "Main Project"
      org_id: example-org

  - model: authincore/application
    id: web-app
    state: present
    attrs:
      name: "Web Application"
      project_id: main-project
      type: oidc
      oidc_config:
        redirect_uris:
          - "http://localhost:3000/callback"
        grant_types:
          - "authorization_code"
          - "refresh_token"
        response_types:
          - "code"
        application_type: "web"
        auth_method_type: "client_secret_basic"

  - model: authincore/webhook
    id: audit-webhook
    state: present
    attrs:
      url: "https://hooks.example.com/authincore"
      events:
        - "identity.created"
        - "identity.deactivated"
        - "session.created"
        - "session.revoked"
      enabled: true

# Chaos Mesh experiments for AuthinCore resilience testing.
# Apply with: kubectl apply -f test/chaos/chaos-mesh.yaml
# Requires Chaos Mesh installed: https://chaos-mesh.org/docs/quick-start/

---
# Experiment 1: Kill Postgres for 30s — verify AuthinCore degrades gracefully
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: authincore-postgres-kill
  namespace: authincore
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces: [authincore]
    labelSelectors:
      app.kubernetes.io/name: postgresql
  duration: 30s
  scheduler:
    cron: "@every 10m"

---
# Experiment 2: Kill Redis for 30s — verify session fallback / graceful error
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: authincore-redis-kill
  namespace: authincore
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces: [authincore]
    labelSelectors:
      app.kubernetes.io/name: redis
  duration: 30s
  scheduler:
    cron: "@every 15m"

---
# Experiment 3: Network partition between AuthinCore and Postgres (60s)
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: authincore-db-partition
  namespace: authincore
spec:
  action: partition
  mode: all
  selector:
    namespaces: [authincore]
    labelSelectors:
      app.kubernetes.io/name: authincore
  direction: both
  target:
    mode: all
    selector:
      namespaces: [authincore]
      labelSelectors:
        app.kubernetes.io/name: postgresql
  duration: 60s

---
# Experiment 4: 200ms latency + 10% packet loss on Postgres connection
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: authincore-db-latency
  namespace: authincore
spec:
  action: netem
  mode: all
  selector:
    namespaces: [authincore]
    labelSelectors:
      app.kubernetes.io/name: authincore
  delay:
    latency: 200ms
    jitter: 50ms
    correlation: "25"
  loss:
    loss: "10"
    correlation: "25"
  direction: to
  target:
    mode: all
    selector:
      namespaces: [authincore]
      labelSelectors:
        app.kubernetes.io/name: postgresql
  duration: 5m

---
# Experiment 5: CPU stress on AuthinCore pod (simulate high load)
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: authincore-cpu-stress
  namespace: authincore
spec:
  mode: one
  selector:
    namespaces: [authincore]
    labelSelectors:
      app.kubernetes.io/name: authincore
  stressors:
    cpu:
      workers: 4
      load: 80
  duration: 2m

---
# Experiment 6: Memory pressure (test for memory leaks under pressure)
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: authincore-memory-stress
  namespace: authincore
spec:
  mode: one
  selector:
    namespaces: [authincore]
    labelSelectors:
      app.kubernetes.io/name: authincore
  stressors:
    memory:
      workers: 2
      size: 512MB
  duration: 5m

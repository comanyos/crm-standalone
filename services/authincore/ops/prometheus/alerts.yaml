groups:
  - name: authincore
    rules:
      - alert: AuthinCoreHighLoginFailureRate
        expr: sum(rate(authincore_login_total{outcome="failure"}[5m])) / clamp_min(sum(rate(authincore_login_total[5m])), 1) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "AuthinCore login failures exceed 5%" }
      - alert: AuthinCoreHighHTTPErrorRate
        expr: sum(rate(authincore_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(authincore_http_requests_total[5m])), 1) > 0.01
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "AuthinCore 5xx rate exceeds 1%" }
      - alert: AuthinCoreP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(authincore_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "AuthinCore p95 latency exceeds 500 ms" }
      - alert: AuthinCoreUnavailable
        expr: up{job="authincore"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "AuthinCore metrics target is unavailable" }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Sign in</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;background:#f4f7fb;font:16px/1.5 system-ui,sans-serif;color:#172033;padding:24px;box-sizing:border-box">
        <section style="max-width:520px;background:white;border:1px solid #dfe5ef;border-radius:16px;padding:32px;box-shadow:0 16px 40px rgba(31,45,61,.08)">
          <h1 style="margin:0 0 8px">AuthinCore hosted UI</h1>
          <p style="margin:0;color:#586477">Loading the sign-in application…</p>
          <noscript><p>This page requires JavaScript.</p></noscript>
          <p id="file-help" hidden style="margin:20px 0 0;padding:12px;background:#fff7df;border-radius:8px;color:#6b4f00">
            This source page cannot run from a file address. In Terminal, open this folder and run <code>npm run open</code>.
          </p>
        </section>
      </main>
    </div>
    <script>
      if (location.protocol === 'file:') document.getElementById('file-help').hidden = false
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

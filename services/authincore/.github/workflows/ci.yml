name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"

env:
  GO_VERSION: "1.26"
  POSTGRES_DSN: postgres://authincore:authincore@localhost:5432/authincore?sslmode=disable
  REDIS_ADDR: localhost:6379

jobs:
  # -------------------------------------------------------------------------
  # 1. Build
  # -------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - run: go build -tags=enterprise ./...

  # -------------------------------------------------------------------------
  # 2. Unit tests + race detector
  # -------------------------------------------------------------------------
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run unit tests
        run: go test ./... -race -count=1 -timeout=120s -coverprofile=coverage.out
      - name: Run enterprise unit tests
        run: go test -tags=enterprise ./... -count=1 -timeout=120s
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # -------------------------------------------------------------------------
  # 3. Fuzz (short run — full runs in nightly)
  # -------------------------------------------------------------------------
  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -fuzz=FuzzLoginBody   ./test/fuzz/ -fuzztime=15s
      - run: go test -fuzz=FuzzSCIMFilter  ./test/fuzz/ -fuzztime=15s
      - run: go test -fuzz=FuzzOAuthParams ./test/fuzz/ -fuzztime=15s

  # -------------------------------------------------------------------------
  # 4. Integration tests (real Postgres + Redis)
  # -------------------------------------------------------------------------
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: authincore
          POSTGRES_PASSWORD: authincore
          POSTGRES_DB: authincore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.POSTGRES_DSN }}
        run: go run ./cmd/authincore migrate
      - name: Run integration tests
        env:
          DATABASE_URL: ${{ env.POSTGRES_DSN }}
          REDIS_ADDR: ${{ env.REDIS_ADDR }}
        run: go test -tags=integration ./test/integration/... -race -count=1 -timeout=300s -v
      - name: Run enterprise integration tests
        env:
          DATABASE_URL: ${{ env.POSTGRES_DSN }}
          REDIS_ADDR: ${{ env.REDIS_ADDR }}
        run: go test -tags='integration enterprise' ./test/integration/... -count=1 -timeout=300s -v

  # -------------------------------------------------------------------------
  # 5. Static analysis
  # -------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gosec
        uses: securego/gosec@master
        with:
          args: -quiet ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # -------------------------------------------------------------------------
  # 6. Container build + Trivy scan
  # -------------------------------------------------------------------------
  container:
    name: Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t authincore:ci .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: authincore:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  # -------------------------------------------------------------------------
  # 7. Admin UI build check
  # -------------------------------------------------------------------------
  admin-ui:
    name: Frontend Tests and Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            admin-ui/package-lock.json
            hosted-ui/package-lock.json
      - run: npm ci
        working-directory: admin-ui
      - run: npm test
        working-directory: admin-ui
      - run: npm run build
        working-directory: admin-ui
      - run: npm audit --audit-level=high
        working-directory: admin-ui
      - run: npm ci
        working-directory: hosted-ui
      - run: npm test
        working-directory: hosted-ui
      - run: npm run build
        working-directory: hosted-ui
      - run: npm audit --audit-level=high
        working-directory: hosted-ui

  sdk:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: go test ./sdk/go/authincore
      - run: npm test
        working-directory: sdk/node
      - run: pip install -e ./sdk/python
      - run: python -m unittest discover -s sdk/python/tests -v

  helm:
    name: Helm Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/authincore
      - run: helm template authincore charts/authincore > rendered.yaml

# -------------------------------------------------------------------------
# Nightly — full fuzz + load tests
# -------------------------------------------------------------------------
  nightly-fuzz:
    name: Nightly Fuzz (10 min each)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -fuzz=FuzzLoginBody   ./test/fuzz/ -fuzztime=10m
      - run: go test -fuzz=FuzzSCIMFilter  ./test/fuzz/ -fuzztime=10m
      - run: go test -fuzz=FuzzOAuthParams ./test/fuzz/ -fuzztime=10m
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-corpus
          path: test/fuzz/testdata/fuzz/

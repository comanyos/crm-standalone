name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: "**/package-lock.json" }
      - run: go test ./... -race -count=1
      - run: go test -tags=enterprise ./... -count=1
      - run: npm ci && npm test && npm run build
        working-directory: hosted-ui
      - run: npm ci && npm test && npm run build
        working-directory: admin-ui

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: authincore
            file: Dockerfile
            args: "ENTERPRISE=false"
          - name: authincore-enterprise
            file: Dockerfile
            args: "ENTERPRISE=true"
          - name: outpost
            file: Dockerfile.outpost
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/authincore
      - run: helm package charts/authincore --destination dist
      - run: helm push dist/authincore-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

// ---------------------------------------------------------------------------
// Task
// ---------------------------------------------------------------------------

// Task is a unit of work someone is expected to do. Unlike Activity it is
// mutable and has a lifecycle; unlike Opportunity its terminal states are
// reversible, because a task that turns out not to be finished is reopened
// rather than replaced — replacing it would lose the record of what was
// originally asked and when.
message Task {
  string id = 1;
  string title = 2;
  string description = 3;
  // status is one of: open, in_progress, completed, cancelled.
  string status = 4;
  // priority is one of: low, normal, high, urgent. Empty means normal.
  string priority = 5;
  // assignee_id is the identity expected to do the work. Empty is allowed:
  // an unassigned task is a real state, not a validation failure.
  string assignee_id = 6;
  // due_at is optional. A task with no due date is never overdue.
  google.protobuf.Timestamp due_at = 7;
  // subject_type + subject_id optionally attach this task to one CRM record,
  // using the same polymorphic edge Activity uses (account, contact, lead,
  // opportunity). Both empty means a standalone task. Setting one without
  // the other is rejected.
  string subject_type = 8;
  string subject_id = 9;
  // completed_at and completed_by are set by CompleteTask and cleared by
  // ReopenTask. They are never writable directly.
  google.protobuf.Timestamp completed_at = 10;
  string completed_by = 11;
  string created_by = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  map<string, CustomValue> custom_fields = 15;
}

message CreateTaskRequest { Task task = 1; }
message CreateTaskResponse { Task task = 1; }
message GetTaskRequest { string id = 1; }
message GetTaskResponse { Task task = 1; }

message ListTasksRequest {
  int32 page_size = 1;
  string page_token = 2;
  // assignee_id, when set, matches Task.assignee_id exactly ("my tasks").
  string assignee_id = 3;
  // status, when set, matches Task.status exactly.
  string status = 4;
  // subject_type + subject_id, when both set, list the tasks attached to one
  // record. Setting one without the other is rejected.
  string subject_type = 5;
  string subject_id = 6;
  // open_only excludes completed and cancelled tasks. It exists separately
  // from status because "still to do" spans two statuses, and making every
  // caller send two requests to answer the most common question would be a
  // poor contract.
  bool open_only = 7;
  // due_before, when set, matches tasks whose due_at is strictly earlier.
  // Combined with open_only this is the overdue list.
  google.protobuf.Timestamp due_before = 8;
  // sort selects the order: "" (default, due date ascending with undated
  // tasks last) or "-created_at" (newest first). An allowlist, not a column.
  string sort = 9;
}
message ListTasksResponse {
  repeated Task tasks = 1;
  string next_page_token = 2;
}

message UpdateTaskRequest { Task task = 1; }
message UpdateTaskResponse { Task task = 1; }
message DeleteTaskRequest { string id = 1; }
message DeleteTaskResponse {}

// CompleteTaskRequest marks a task done. actor_id records who completed it;
// when empty the server uses the calling principal.
message CompleteTaskRequest {
  string id = 1;
  string actor_id = 2;
}
message CompleteTaskResponse { Task task = 1; }
message ReopenTaskRequest { string id = 1; }
message ReopenTaskResponse { Task task = 1; }

// ---------------------------------------------------------------------------
// Note
// ---------------------------------------------------------------------------

// Note is authored prose about one CRM record. It is deliberately mutable:
// a note is a working document that gets corrected, which is exactly why it
// cannot be an Activity — Activity's value comes from being immutable.
message Note {
  string id = 1;
  // body is the note's text. Required.
  string body = 2;
  // subject_type + subject_id are required: a note is always about
  // something. The same polymorphic edge Activity and Task use.
  string subject_type = 3;
  string subject_id = 4;
  string author_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // edited_at is set the first time the body actually changes, and left
  // alone by a write that changes nothing. A reader can tell a corrected
  // note from an original one without diffing anything.
  google.protobuf.Timestamp edited_at = 8;
  map<string, CustomValue> custom_fields = 9;
}

message CreateNoteRequest { Note note = 1; }
message CreateNoteResponse { Note note = 1; }
message GetNoteRequest { string id = 1; }
message GetNoteResponse { Note note = 1; }

message ListNotesRequest {
  int32 page_size = 1;
  string page_token = 2;
  // subject_type + subject_id, when both set, list the notes on one record.
  string subject_type = 3;
  string subject_id = 4;
  // author_id, when set, matches Note.author_id exactly.
  string author_id = 5;
}
message ListNotesResponse {
  repeated Note notes = 1;
  string next_page_token = 2;
}

message UpdateNoteRequest { Note note = 1; }
message UpdateNoteResponse { Note note = 1; }
message DeleteNoteRequest { string id = 1; }
message DeleteNoteResponse {}

// ---------------------------------------------------------------------------
// Workflow automation
// ---------------------------------------------------------------------------

// WorkflowCondition is one typed comparison. Conditions combine with AND
// only; see docs/WORKFLOW_AUTOMATION.md for why v1 has no expression tree.
message WorkflowCondition {
  // field must be one the catalog names for the trigger's object type.
  string field = 1;
  // operator is one of eq, neq, gt, lt, contains, in — and which of those are
  // legal depends on the field's kind, which is why the catalog reports them
  // per field rather than as one global list.
  string operator = 2;
  // value is compared as text or as a number according to the field's kind.
  // For the "in" operator it is a comma-separated list.
  string value = 3;
}

// WorkflowAction is one thing a rule does. The fields each action type uses
// are enforced server-side; the others are ignored.
message WorkflowAction {
  // type is create_task, add_activity, notify or assign_owner.
  string type = 1;
  // title is the task title or the notification title.
  string title = 2;
  // body is the task description, the activity note or the notification body.
  // It is literal text: v1 expands no templates, because a template that can
  // read the record can read fields the rule author may not see.
  string body = 3;
  // assignee is record_owner or fixed_user, and decides who a task is for or
  // who is notified. record_owner is resolved when the action runs, against
  // the record as it is then — not as the event found it.
  string assignee = 4;
  // assignee_id names the principal when assignee is fixed_user.
  string assignee_id = 5;
  // priority applies to create_task and must be a task priority.
  string priority = 6;
  // due_in_days offsets a created task's due date from execution. Zero means
  // the task has no due date.
  int32 due_in_days = 7;
  // activity_kind applies to add_activity.
  string activity_kind = 8;
  // rotation_members applies to assign_owner: the ordered principals the
  // action hands records to, one after another (task_crm.md §8). Order is
  // meaningful — "who is next" is only answerable against a fixed sequence —
  // and a member listed twice is refused rather than given twice the work.
  //
  // An assign_owner action must not also set assignee or assignee_id: it
  // chooses the assignee from this list, and naming one too would give it two
  // answers to the same question.
  repeated string rotation_members = 9;
  // channel_kind and template_id apply to draft_message (task_crm.md §6).
  //
  // The template is named rather than copied, so editing the wording changes
  // what future runs draft — the opposite of the rule's own literal text,
  // which is frozen in its version. A rule version has to say what it did;
  // nobody wants to publish a new one to fix a typo in an opener.
  string channel_kind = 10;
  string template_id = 11;
}

// WorkflowRule is the durable rule: a name, a lifecycle state, and a pointer
// at the version that runs.
message WorkflowRule {
  string id = 1;
  string name = 2;
  string description = 3;
  // status is draft, active, paused or archived. Archived is terminal.
  string status = 4;
  // active_version_id is the version executions use. Empty for a rule that
  // has never been published.
  string active_version_id = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// WorkflowRuleVersion is an immutable snapshot of what a rule said. Nothing
// edits one; publishing writes another.
message WorkflowRuleVersion {
  string id = 1;
  string rule_id = 2;
  // version counts from 1 per rule.
  int32 version = 3;
  string trigger_event_type = 4;
  // trigger_object_type is derived from the trigger rather than supplied.
  string trigger_object_type = 5;
  repeated WorkflowCondition conditions = 6;
  repeated WorkflowAction actions = 7;
  string created_by = 8;
  google.protobuf.Timestamp created_at = 9;
}

// WorkflowExecution is one rule version's encounter with one event.
message WorkflowExecution {
  string id = 1;
  string rule_id = 2;
  string rule_version_id = 3;
  string source_event_id = 4;
  string source_event_type = 5;
  string subject_type = 6;
  string subject_id = 7;
  // status is pending, running, succeeded, failed or skipped. Skipped means
  // the rule saw the event and its conditions did not hold — recorded rather
  // than discarded, because that is the question authors actually ask.
  string status = 8;
  int32 attempts = 9;
  // error_category is a bounded code — record_gone, no_assignee,
  // action_failed, rule_version_gone, invalid_action — never a message. The
  // failing action may have been holding a customer's data.
  string error_category = 10;
  // actions_completed is how far the execution got, so a retry resumes rather
  // than repeating an action that already succeeded.
  int32 actions_completed = 11;
  google.protobuf.Timestamp next_attempt_at = 12;
  google.protobuf.Timestamp started_at = 13;
  google.protobuf.Timestamp finished_at = 14;
  google.protobuf.Timestamp created_at = 15;
}

// Notification is one in-app message for one principal.
message Notification {
  string id = 1;
  string kind = 2;
  string title = 3;
  string body = 4;
  // subject_type + subject_id link to the record, so the reader can go there.
  string subject_type = 5;
  string subject_id = 6;
  // rule_id names the rule that raised it, when a rule did.
  string rule_id = 7;
  google.protobuf.Timestamp read_at = 8;
  google.protobuf.Timestamp created_at = 9;
}

// WorkflowField is one comparable field and the operators it accepts.
message WorkflowField {
  string name = 1;
  // kind is "text" or "number", and decides the operators.
  string kind = 2;
  repeated string operators = 3;
}

// WorkflowTriggerDescriptor is one event a rule may fire on, with the fields
// its conditions may compare.
message WorkflowTriggerDescriptor {
  string event_type = 1;
  string object_type = 2;
  repeated WorkflowField fields = 3;
}

message DescribeWorkflowCatalogRequest {}
message DescribeWorkflowCatalogResponse {
  repeated WorkflowTriggerDescriptor triggers = 1;
  // action_types and assignee_selectors are the remaining allowlists.
  repeated string action_types = 2;
  repeated string assignee_selectors = 3;
  // The authoring bounds the server enforces, reported so the editor can
  // enforce the same ones rather than guessing at them.
  int32 max_conditions = 4;
  int32 max_actions = 5;
  int32 max_text_length = 6;
  // max_rotation_members bounds an assign_owner action's member list.
  int32 max_rotation_members = 7;
  // assignable_subjects are the record types assign_owner can set an owner
  // on. An opportunity is deliberately absent: its owner is its account's, so
  // assigning one would reassign the account and every other opportunity on
  // it.
  repeated string assignable_subjects = 8;
}

// CreateWorkflowRuleRequest starts a rule. It is always created as a draft:
// a rule cannot be active before it has a published version to run.
message CreateWorkflowRuleRequest {
  string name = 1;
  string description = 2;
}
message CreateWorkflowRuleResponse { WorkflowRule rule = 1; }

message GetWorkflowRuleRequest { string id = 1; }
message GetWorkflowRuleResponse {
  WorkflowRule rule = 1;
  // active_version is the version this rule runs, when it has one.
  WorkflowRuleVersion active_version = 2;
}

message ListWorkflowRulesRequest {
  // include_archived brings back retired rules, which are hidden by default.
  bool include_archived = 1;
}
message ListWorkflowRulesResponse { repeated WorkflowRule rules = 1; }

// UpdateWorkflowRuleRequest changes a rule's label only. What the rule *does*
// is versioned, and changing it goes through PublishWorkflowRuleVersion.
message UpdateWorkflowRuleRequest {
  string id = 1;
  string name = 2;
  string description = 3;
}
message UpdateWorkflowRuleResponse { WorkflowRule rule = 1; }

message PublishWorkflowRuleVersionRequest {
  string rule_id = 1;
  string trigger_event_type = 2;
  repeated WorkflowCondition conditions = 3;
  repeated WorkflowAction actions = 4;
  // activate points the rule at this new version and makes it active. Without
  // it publishing changes nothing about what is running: an author editing a
  // live rule gets to review the new version before it starts acting.
  bool activate = 5;
}
message PublishWorkflowRuleVersionResponse {
  WorkflowRuleVersion version = 1;
  WorkflowRule rule = 2;
}

message ListWorkflowRuleVersionsRequest { string rule_id = 1; }
message ListWorkflowRuleVersionsResponse { repeated WorkflowRuleVersion versions = 1; }

message SetWorkflowRuleStatusRequest {
  string id = 1;
  // status is draft, active, paused or archived. Archived is terminal:
  // a retired rule that could be switched back on is one that can start
  // acting on records long after everyone stopped thinking about it.
  string status = 2;
}
message SetWorkflowRuleStatusResponse { WorkflowRule rule = 1; }

message ListWorkflowExecutionsRequest {
  string rule_id = 1;
  // limit bounds the page. Zero means the server default.
  int32 limit = 2;
}
message ListWorkflowExecutionsResponse { repeated WorkflowExecution executions = 1; }

message ListNotificationsRequest {
  bool unread_only = 1;
  int32 limit = 2;
}
message ListNotificationsResponse {
  repeated Notification notifications = 1;
  // unread_count is the badge, and counts the caller's unread notifications
  // rather than the ones this page happened to return.
  int32 unread_count = 2;
}

message MarkNotificationReadRequest { string id = 1; }
message MarkNotificationReadResponse { Notification notification = 1; }


syntax = "proto3";

package crm.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/santoshguru/crm/gen/crm/v1;crmv1";

// CRMService is the domain API. Every RPC is tenant-scoped: the tenant is taken
// from the caller's verified JWT, never from the request body.
service CRMService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);

  rpc CreateContact(CreateContactRequest) returns (CreateContactResponse);
  rpc GetContact(GetContactRequest) returns (GetContactResponse);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  rpc UpdateContact(UpdateContactRequest) returns (UpdateContactResponse);
  rpc DeleteContact(DeleteContactRequest) returns (DeleteContactResponse);

  rpc CreateLead(CreateLeadRequest) returns (CreateLeadResponse);
  rpc GetLead(GetLeadRequest) returns (GetLeadResponse);
  rpc ListLeads(ListLeadsRequest) returns (ListLeadsResponse);
  rpc UpdateLead(UpdateLeadRequest) returns (UpdateLeadResponse);
  rpc DeleteLead(DeleteLeadRequest) returns (DeleteLeadResponse);
  // ConvertLead is the load-bearing B1 operation (docs/customer-os/PLAN.md):
  // in one transaction it creates (or reuses, if the lead's email already
  // names one) a Contact, attaches it to an Account (existing match by email
  // domain, or a new one), optionally creates an Opportunity, and marks the
  // lead converted with the linked ids. Retrying with the same lead_id is a
  // no-op that returns the ids the first successful call produced.
  rpc ConvertLead(ConvertLeadRequest) returns (ConvertLeadResponse);

  rpc CreateOpportunity(CreateOpportunityRequest) returns (CreateOpportunityResponse);
  rpc GetOpportunity(GetOpportunityRequest) returns (GetOpportunityResponse);
  rpc ListOpportunities(ListOpportunitiesRequest) returns (ListOpportunitiesResponse);
  rpc UpdateOpportunity(UpdateOpportunityRequest) returns (UpdateOpportunityResponse);
  // MoveOpportunityToPipeline is deliberately narrower than UpdateOpportunity:
  // cross-pipeline moves require an explicit destination pipeline and open
  // stage, while preserving the deal's other fields and its audit history.
  rpc MoveOpportunityToPipeline(MoveOpportunityToPipelineRequest) returns (MoveOpportunityToPipelineResponse);
  rpc DeleteOpportunity(DeleteOpportunityRequest) returns (DeleteOpportunityResponse);
  // Returns the append-only history for an opportunity. This is intentionally
  // separate from the mutable opportunity response so history remains useful
  // for audit and reporting clients.
  rpc ListOpportunityStageHistory(ListOpportunityStageHistoryRequest) returns (ListOpportunityStageHistoryResponse);

  // Pipeline configuration is organization administration data. These RPCs
  // manage definitions only; the later opportunity migration will bind each
  // deal to pipeline_id/stage_id without rewriting historical stage text.
  rpc CreatePipeline(CreatePipelineRequest) returns (CreatePipelineResponse);
  rpc GetPipeline(GetPipelineRequest) returns (GetPipelineResponse);
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse);
  rpc UpdatePipeline(UpdatePipelineRequest) returns (UpdatePipelineResponse);
  rpc CreatePipelineStage(CreatePipelineStageRequest) returns (CreatePipelineStageResponse);
  rpc ListPipelineStages(ListPipelineStagesRequest) returns (ListPipelineStagesResponse);
  rpc UpdatePipelineStage(UpdatePipelineStageRequest) returns (UpdatePipelineStageResponse);

  rpc CreateActivity(CreateActivityRequest) returns (CreateActivityResponse);
  rpc GetActivity(GetActivityRequest) returns (GetActivityResponse);
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse);
  rpc UpdateActivity(UpdateActivityRequest) returns (UpdateActivityResponse);
  rpc DeleteActivity(DeleteActivityRequest) returns (DeleteActivityResponse);
  // ListActivitiesForSubject is the B5 timeline query
  // (docs/customer-os/PLAN.md): every Activity attached to one polymorphic
  // subject (subject_type + subject_id), newest first by occurred_at.
  rpc ListActivitiesForSubject(ListActivitiesForSubjectRequest) returns (ListActivitiesForSubjectResponse);

  // Tasks and Notes are first-class entities, not Activity kinds.
  //
  // An Activity records what happened and is immutable once logged. A Task
  // records what should happen: it has a lifecycle, an assignee and a due
  // date, and it is edited repeatedly until it is done. A Note is authored
  // prose that gets corrected. Expressing either as an Activity would mean
  // making Activity mutable — destroying the property that makes it useful
  // for audit — or storing tasks that can never be completed.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  // CompleteTask and ReopenTask are separate from UpdateTask on purpose.
  // Ticking a checkbox should not require sending the whole record back:
  // that is a read-modify-write, and under optimistic concurrency it either
  // fails against a concurrent edit or silently clobbers one. Both are
  // idempotent — completing a completed task returns it unchanged.
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
  rpc ReopenTask(ReopenTaskRequest) returns (ReopenTaskResponse);

  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse);
  rpc GetNote(GetNoteRequest) returns (GetNoteResponse);
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);
  rpc UpdateNote(UpdateNoteRequest) returns (UpdateNoteResponse);
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse);

  // Custom-field definitions are tenant administration data. Values travel on
  // the shipped record messages above, but a definition is the authority for
  // their type, requiredness, picklist options, and lookup target.
  rpc CreateCustomFieldDefinition(CreateCustomFieldDefinitionRequest) returns (CreateCustomFieldDefinitionResponse);
  rpc GetCustomFieldDefinition(GetCustomFieldDefinitionRequest) returns (GetCustomFieldDefinitionResponse);
  rpc ListCustomFieldDefinitions(ListCustomFieldDefinitionsRequest) returns (ListCustomFieldDefinitionsResponse);
  rpc UpdateCustomFieldDefinition(UpdateCustomFieldDefinitionRequest) returns (UpdateCustomFieldDefinitionResponse);
  rpc ArchiveCustomFieldDefinition(ArchiveCustomFieldDefinitionRequest) returns (ArchiveCustomFieldDefinitionResponse);

  rpc CreateCustomObjectDefinition(CreateCustomObjectDefinitionRequest) returns (CreateCustomObjectDefinitionResponse);
  rpc GetCustomObjectDefinition(GetCustomObjectDefinitionRequest) returns (GetCustomObjectDefinitionResponse);
  rpc ListCustomObjectDefinitions(ListCustomObjectDefinitionsRequest) returns (ListCustomObjectDefinitionsResponse);
  rpc ArchiveCustomObjectDefinition(ArchiveCustomObjectDefinitionRequest) returns (ArchiveCustomObjectDefinitionResponse);
  rpc CreateCustomRecord(CreateCustomRecordRequest) returns (CreateCustomRecordResponse);
  rpc GetCustomRecord(GetCustomRecordRequest) returns (GetCustomRecordResponse);
  rpc ListCustomRecords(ListCustomRecordsRequest) returns (ListCustomRecordsResponse);
  rpc UpdateCustomRecord(UpdateCustomRecordRequest) returns (UpdateCustomRecordResponse);
  rpc DeleteCustomRecord(DeleteCustomRecordRequest) returns (DeleteCustomRecordResponse);

  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
  // SearchRecords is the bounded, tenant-scoped quick-search surface used by
  // the command palette. It searches the primary identifying fields of the
  // core record types in the database; clients must not implement search by
  // downloading arbitrary list pages and filtering them locally.
  rpc SearchRecords(SearchRecordsRequest) returns (SearchRecordsResponse);

  // The Google connection (docs/GOOGLE_INTEGRATION.md).
  //
  // Every RPC here acts on the *calling principal's own* connection. None of
  // them takes an owner: Gmail and Calendar consent belongs to the person who
  // granted it, so letting a request name whose mailbox to disconnect — or
  // whose authorization to start — would be an authorization bug no scope
  // could fix. ListGoogleConnections is the one administrative view, and it
  // returns status only.
  //
  // No response here ever carries a token, a refresh token, a PKCE verifier,
  // or the OAuth client secret. The credential stays sealed server-side; see
  // internal/integration/google.
  rpc StartGoogleConnection(StartGoogleConnectionRequest) returns (StartGoogleConnectionResponse);
  rpc GetGoogleConnection(GetGoogleConnectionRequest) returns (GetGoogleConnectionResponse);
  rpc ListGoogleConnections(ListGoogleConnectionsRequest) returns (ListGoogleConnectionsResponse);
  rpc DisconnectGoogleConnection(DisconnectGoogleConnectionRequest) returns (DisconnectGoogleConnectionResponse);
  // SyncGoogleMailbox runs one Gmail synchronisation pass for the calling
  // user's own mailbox, now, rather than waiting for the background poller.
  // It is bounded: one pass examines a fixed number of messages and stores a
  // cursor, so a large mailbox needs several and the caller can simply ask
  // again.
  rpc SyncGoogleMailbox(SyncGoogleMailboxRequest) returns (SyncGoogleMailboxResponse);
  // SyncGoogleCalendar is SyncGoogleMailbox's twin for the calling user's own
  // calendar, and is bounded the same way.
  rpc SyncGoogleCalendar(SyncGoogleCalendarRequest) returns (SyncGoogleCalendarResponse);

  // Data-subject requests against synchronised communication content
  // (docs/GOOGLE_INTEGRATION.md).
  //
  // These are administrative rather than personal: unlike the sync RPCs they
  // name a record or an address, because the person exercising a right is
  // usually not the person holding the CRM login. They carry their own scope
  // for that reason.
  rpc EraseSyncedContentForContact(EraseSyncedContentForContactRequest) returns (EraseSyncedContentResponse);
  rpc ListSyncSuppressions(ListSyncSuppressionsRequest) returns (ListSyncSuppressionsResponse);
  rpc SuppressSyncAddress(SuppressSyncAddressRequest) returns (SuppressSyncAddressResponse);
  rpc ReleaseSyncAddress(ReleaseSyncAddressRequest) returns (ReleaseSyncAddressResponse);

  // Workflow automation (docs/WORKFLOW_AUTOMATION.md).
  //
  // A rule is authored as a draft, published as an immutable version, and
  // then activated. Editing never mutates what is running: PublishWorkflow-
  // RuleVersion writes a new version, and the rule keeps executing the one it
  // points at until somebody activates the new one. That is what makes an
  // execution's ledger row meaningful — it names the exact text of the rule
  // that ran, months later, after the rule has been edited four times.
  //
  // DescribeWorkflowCatalog exists so the editor offers exactly what the
  // server accepts. Triggers, comparable fields, operators and action types
  // are allowlists; a UI that guessed at them would let an author compose a
  // rule that cannot be saved, or worse, one that saves and never matches.
  rpc DescribeWorkflowCatalog(DescribeWorkflowCatalogRequest) returns (DescribeWorkflowCatalogResponse);
  rpc CreateWorkflowRule(CreateWorkflowRuleRequest) returns (CreateWorkflowRuleResponse);
  rpc GetWorkflowRule(GetWorkflowRuleRequest) returns (GetWorkflowRuleResponse);
  rpc ListWorkflowRules(ListWorkflowRulesRequest) returns (ListWorkflowRulesResponse);
  rpc UpdateWorkflowRule(UpdateWorkflowRuleRequest) returns (UpdateWorkflowRuleResponse);
  rpc PublishWorkflowRuleVersion(PublishWorkflowRuleVersionRequest) returns (PublishWorkflowRuleVersionResponse);
  rpc ListWorkflowRuleVersions(ListWorkflowRuleVersionsRequest) returns (ListWorkflowRuleVersionsResponse);
  rpc SetWorkflowRuleStatus(SetWorkflowRuleStatusRequest) returns (SetWorkflowRuleStatusResponse);
  // ListWorkflowExecutions is the answer to "why didn't my rule fire": every
  // event the rule was considered for, including the ones whose conditions
  // did not hold, and the bounded reason for each failure.
  rpc ListWorkflowExecutions(ListWorkflowExecutionsRequest) returns (ListWorkflowExecutionsResponse);

  // In-app notifications.
  //
  // Both RPCs act on the calling principal's own notifications and take no
  // recipient, for the same reason the Google RPCs take no owner: letting a
  // request name whose inbox to read would be an authorization bug no scope
  // could fix.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse);

  // Tags (M4 — data productivity). A tag is a tenant-authored label; an
  // assignment attaches one to one record of an allowlisted type (account,
  // contact, lead, opportunity, task). AssignTag and RemoveTag are
  // idempotent, so a bulk "add tag" action can retry a partial batch safely.
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc UpdateTag(UpdateTagRequest) returns (UpdateTagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
  rpc AssignTag(AssignTagRequest) returns (AssignTagResponse);
  rpc RemoveTag(RemoveTagRequest) returns (RemoveTagResponse);
  rpc ListTagsForRecord(ListTagsForRecordRequest) returns (ListTagsForRecordResponse);
  // ListTaggedRecords is the filter surface a list page uses to answer "show
  // me every record tagged X" until per-entity filters grow a tag field of
  // their own.
  rpc ListTaggedRecords(ListTaggedRecordsRequest) returns (ListTaggedRecordsResponse);

  // Bulk operations (M4 — data productivity).
  //
  // Every bulk RPC is bounded (see maxBulkBatch in internal/api) and reports
  // one BulkItemResult per requested id rather than succeeding or failing as
  // a unit: a batch is not a transaction, and telling a caller "12 of 40
  // succeeded, here are the 28 that did not and why" is the honest answer
  // when the underlying per-record operations already have their own
  // semantics (idempotent assign/remove, optimistic-concurrency updates).
  // Each item is authorized exactly as its single-record RPC would be —
  // scope-gated by procedure, then existence-checked per id inside the
  // caller's own tenant — so a foreign or nonexistent id fails only that
  // item, the same NotFound a direct call would produce.
  rpc BulkAssignTag(BulkAssignTagRequest) returns (BulkAssignTagResponse);
  rpc BulkRemoveTag(BulkRemoveTagRequest) returns (BulkRemoveTagResponse);
  rpc BulkCompleteTasks(BulkCompleteTasksRequest) returns (BulkCompleteTasksResponse);
  rpc BulkReopenTasks(BulkReopenTasksRequest) returns (BulkReopenTasksResponse);
  rpc BulkReassignTaskAssignee(BulkReassignTaskAssigneeRequest) returns (BulkReassignTaskAssigneeResponse);
  // BulkReassignAccountOwner and BulkReassignLeadOwner are separate RPCs
  // rather than one parameterized by object_type, so each can carry its own
  // static write scope (crm:account:write / crm:lead:write) the way every
  // other entity-specific RPC does, instead of a scope check that depends on
  // a request field the interceptor's static policy cannot see.
  rpc BulkReassignAccountOwner(BulkReassignAccountOwnerRequest) returns (BulkReassignAccountOwnerResponse);
  rpc BulkReassignLeadOwner(BulkReassignLeadOwnerRequest) returns (BulkReassignLeadOwnerResponse);

  // Saved views (M4 — data productivity). Private to the caller by
  // construction — see internal/domain/saved_views.go's doc comment for why
  // there is no sharing yet — so every RPC here reads only the caller's own
  // views, the same way notifications do.
  rpc CreateSavedView(CreateSavedViewRequest) returns (CreateSavedViewResponse);
  rpc ListSavedViews(ListSavedViewsRequest) returns (ListSavedViewsResponse);
  rpc UpdateSavedView(UpdateSavedViewRequest) returns (UpdateSavedViewResponse);
  rpc DeleteSavedView(DeleteSavedViewRequest) returns (DeleteSavedViewResponse);

  // Account deduplication and merge (M4 — data productivity). There is no
  // undo — see internal/domain/merge_accounts.go's package doc comment for
  // why — so a client must confirm with the caller before sending this.
  rpc MergeAccounts(MergeAccountsRequest) returns (MergeAccountsResponse);
  // ListAccountMerges is the immutable audit trail: every merge one account
  // was ever part of, as the kept id or the retired one.
  rpc ListAccountMerges(ListAccountMergesRequest) returns (ListAccountMergesResponse);

  // CSV import and export, accounts only in v1 (M4 — data productivity).
  // See docs/CSV_IMPORT_EXPORT.md for the full product decision record:
  // size bounds, field mapping, duplicate policy, and — importantly —
  // that both run synchronously inside the RPC call rather than as a
  // true background job, and that a committed import has no rollback.
  //
  // CreateImportJob is the dry run: it validates and stores the upload,
  // returning per-row errors, without creating any Account.
  // CommitImportJob is what actually creates them, and is idempotent —
  // calling it again on an already-completed job returns the stored
  // result rather than re-running it.
  rpc CreateImportJob(CreateImportJobRequest) returns (CreateImportJobResponse);
  rpc GetImportJob(GetImportJobRequest) returns (GetImportJobResponse);
  rpc ListImportJobs(ListImportJobsRequest) returns (ListImportJobsResponse);
  rpc CommitImportJob(CommitImportJobRequest) returns (CommitImportJobResponse);
  // ExportAccounts generates and returns CSV for the caller's own tenant,
  // bounded at 500 rows, inline in the response — there is no object
  // storage to hand back a download link from (docs/CSV_IMPORT_EXPORT.md).
  rpc ExportAccounts(ExportAccountsRequest) returns (ExportAccountsResponse);
  // ListExportJobs is the audit trail of who exported, when, and how many
  // rows — the export content itself is never persisted.
  rpc ListExportJobs(ListExportJobsRequest) returns (ListExportJobsResponse);

  // GetDashboardReport is the bounded, tenant-scoped reporting surface
  // (M4 — data productivity): one page of pipeline/stage summary per
  // pipeline, a task status summary, the lead conversion funnel, and the
  // default-weighted pipeline forecast. See internal/domain/reporting.go
  // for the canonical metric semantics (currency, time zone, pipeline
  // status, and forecast) this report follows.
  rpc GetDashboardReport(GetDashboardReportRequest) returns (GetDashboardReportResponse);

  // Messaging channels and consent (task_crm.md §2).
  //
  // ListContactChannels is the read every messaging UI makes. It returns one
  // entry per channel a contact could be reached on, each already carrying
  // the answer to "may we use this" — because that answer is
  // domain.MayMessage's, and a browser that fetched the address and the
  // consent rows separately would be re-deciding it client-side, which is
  // exactly the check that must not be reimplementable.
  //
  // A channel whose number has no country code comes back unreachable with a
  // reason rather than absent: a local number cannot be keyed unambiguously
  // in the consent ledger, and inferring the country code would produce a
  // different person's number. See internal/domain/messaging.go.
  rpc ListContactChannels(ListContactChannelsRequest) returns (ListContactChannelsResponse);
  // RecordMessagingConsent appends one decision. There is no update and no
  // delete: withdrawing is a new row saying so, which is what lets the ledger
  // answer when a decision was made and on what evidence.
  rpc RecordMessagingConsent(RecordMessagingConsentRequest) returns (RecordMessagingConsentResponse);
  // ListMessagingConsent is that history for one address on one channel,
  // newest first — the read a compliance or support question needs.
  rpc ListMessagingConsent(ListMessagingConsentRequest) returns (ListMessagingConsentResponse);

  // Message templates (task_crm.md §5). Reusable wording per channel, shared
  // across the tenant the way tags are rather than owned per user.
  //
  // A body may carry {{placeholders}} from a fixed allowlist, refused at save
  // time if unknown — a template that shipped "{{contact.phone}}" verbatim is
  // a mistake the author hears about from the recipient, if at all. Nothing
  // expands one on the server: the browser substitutes from the record it is
  // already showing, for somebody already looking at it, which is why this
  // needs none of the field-visibility model that still blocks templated
  // workflow action text.
  rpc CreateMessageTemplate(CreateMessageTemplateRequest) returns (CreateMessageTemplateResponse);
  rpc ListMessageTemplates(ListMessageTemplatesRequest) returns (ListMessageTemplatesResponse);
  rpc UpdateMessageTemplate(UpdateMessageTemplateRequest) returns (UpdateMessageTemplateResponse);
  rpc DeleteMessageTemplate(DeleteMessageTemplateRequest) returns (DeleteMessageTemplateResponse);
  // DescribeMessageTemplateCatalog reports the channels a template may be
  // written for and the merge fields it may use, so the editor offers exactly
  // what the server accepts rather than holding its own copy of the list.
  rpc DescribeMessageTemplateCatalog(DescribeMessageTemplateCatalogRequest) returns (DescribeMessageTemplateCatalogResponse);

  // Inbound lead capture (task_crm.md §1, docs/LEAD_CAPTURE.md).
  //
  // These administer the endpoints; the deliveries themselves arrive on an
  // unauthenticated HTTP route, not through this service.
  //
  // Creating an endpoint is tenant-wide authority to create records — anybody
  // holding the URL and the secret can make leads — so it sits behind its own
  // crm:capture scope pair rather than crm:lead:write. A member who may
  // create a lead by hand still may not mint a URL that lets the internet do
  // it.
  //
  // The signing secret is returned exactly once, by Create and by Rotate. It
  // is stored sealed and there is no RPC that reads one back: a secret an API
  // can return is a secret every future bug can leak.
  rpc CreateLeadCaptureEndpoint(CreateLeadCaptureEndpointRequest) returns (CreateLeadCaptureEndpointResponse);
  rpc ListLeadCaptureEndpoints(ListLeadCaptureEndpointsRequest) returns (ListLeadCaptureEndpointsResponse);
  rpc UpdateLeadCaptureEndpoint(UpdateLeadCaptureEndpointRequest) returns (UpdateLeadCaptureEndpointResponse);
  rpc RotateLeadCaptureSecret(RotateLeadCaptureSecretRequest) returns (RotateLeadCaptureSecretResponse);
  // ListLeadCaptureDeliveries is this feature's own debugger: every delivery
  // with its outcome, including the rejected ones. Without it every failure
  // is a support call.
  rpc ListLeadCaptureDeliveries(ListLeadCaptureDeliveriesRequest) returns (ListLeadCaptureDeliveriesResponse);

  // Messages an automation has drafted (task_crm.md §6).
  //
  // Drafts, never sends. Nothing in this service delivers a message —
  // provider-sent messaging is §4 and waits on a provider contract — so a
  // rule decides who to contact, checks that contacting them is permitted,
  // and writes the wording; a rep sends it in one tap through the same
  // click-to-chat links they use by hand.
  //
  // MarkOutboundMessageSent records that a human sent it. It is the honest
  // verb: the service did not send anything and must not claim to.
  rpc ListOutboundMessages(ListOutboundMessagesRequest) returns (ListOutboundMessagesResponse);
  rpc MarkOutboundMessageSent(MarkOutboundMessageSentRequest) returns (MarkOutboundMessageSentResponse);
  rpc DiscardOutboundMessage(DiscardOutboundMessageRequest) returns (DiscardOutboundMessageResponse);
}

// OutboundMessage is one message an automation drafted for a person to send.
message OutboundMessage {
  string id = 1;
  // subject_type is lead or contact — the record types that carry an address
  // of their own.
  string subject_type = 2;
  string subject_id = 3;
  string channel_kind = 4;
  // address is normalised, and was consent-checked when the draft was made.
  // It is checked again before sending, because consent can be withdrawn in
  // between.
  string address = 5;
  string subject = 6;
  string body = 7;
  // status is pending, sent or discarded.
  string status = 8;
  string assignee_id = 9;
  string rule_version_id = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp sent_at = 12;
  string sent_by = 13;
  string discard_reason = 14;
  // may_still_send re-checks consent at read time. A draft written yesterday
  // to somebody who opted out this morning must not be offered for sending,
  // and the queue is exactly where that gap shows up.
  bool may_still_send = 15;
  string refusal_reason = 16;
}

message ListOutboundMessagesRequest {
  // status narrows the queue; empty returns every state.
  string status = 1;
  // subject_type and subject_id narrow to one record's drafts.
  string subject_type = 2;
  string subject_id = 3;
  // mine_only limits the queue to the caller's own drafts.
  bool mine_only = 4;
  int32 limit = 5;
}
message ListOutboundMessagesResponse { repeated OutboundMessage messages = 1; }

message MarkOutboundMessageSentRequest { string id = 1; }
message MarkOutboundMessageSentResponse { OutboundMessage message = 1; }

message DiscardOutboundMessageRequest { string id = 1; }
message DiscardOutboundMessageResponse { OutboundMessage message = 1; }

// LeadCaptureEndpoint is one issued URL. It never carries the signing secret:
// that is returned once at creation and rotation and then only stored sealed.
message LeadCaptureEndpoint {
  string id = 1;
  string name = 2;
  // token is the unguessable path segment. It is not a secret — it appears in
  // the caller's own logs — but it is what resolves the tenant, so it is only
  // ever shown to somebody who already holds crm:capture:read.
  string token = 3;
  string source_kind = 4;
  // field_mapping maps the caller's field names onto lead fields, using the
  // same vocabulary as CSV import.
  map<string, string> field_mapping = 5;
  string default_owner_id = 6;
  // status is active or disabled.
  string status = 7;
  string created_by = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp last_delivery_at = 11;
  // last_error is a bounded reason code from the most recent delivery, so an
  // administrator can see at a glance which endpoint has stopped working.
  string last_error = 12;
}

// LeadCaptureDelivery is one POST received.
message LeadCaptureDelivery {
  string id = 1;
  string endpoint_id = 2;
  string dedup_key = 3;
  // outcome is created, duplicate, rejected or failed.
  string outcome = 4;
  string reason = 5;
  // raw_payload is what arrived, kept because "the lead came in but the phone
  // number is missing" is unanswerable without it.
  string raw_payload = 6;
  string lead_id = 7;
  google.protobuf.Timestamp received_at = 8;
}

message CreateLeadCaptureEndpointRequest {
  string name = 1;
  map<string, string> field_mapping = 2;
  string default_owner_id = 3;
}
message CreateLeadCaptureEndpointResponse {
  LeadCaptureEndpoint endpoint = 1;
  // signing_secret is shown exactly once. There is no way to read it back.
  string signing_secret = 2;
  // delivery_url is the full URL to configure, assembled server-side so a
  // client cannot get the path wrong.
  string delivery_url = 3;
}

message ListLeadCaptureEndpointsRequest {}
message ListLeadCaptureEndpointsResponse {
  repeated LeadCaptureEndpoint endpoints = 1;
  // base_url is the prefix a delivery URL is built from, so the UI can show a
  // complete URL for each endpoint without hard-coding the route.
  string base_url = 2;
}

message UpdateLeadCaptureEndpointRequest {
  string id = 1;
  string name = 2;
  map<string, string> field_mapping = 3;
  string default_owner_id = 4;
  string status = 5;
}
message UpdateLeadCaptureEndpointResponse { LeadCaptureEndpoint endpoint = 1; }

message RotateLeadCaptureSecretRequest { string id = 1; }
message RotateLeadCaptureSecretResponse {
  LeadCaptureEndpoint endpoint = 1;
  // The new secret, shown once. The previous one stops working immediately.
  string signing_secret = 2;
}

message ListLeadCaptureDeliveriesRequest {
  string endpoint_id = 1;
  int32 limit = 2;
}
message ListLeadCaptureDeliveriesResponse { repeated LeadCaptureDelivery deliveries = 1; }

// MessageTemplate is one piece of reusable wording.
message MessageTemplate {
  string id = 1;
  string name = 2;
  // channel_kind is email, sms or whatsapp. Voice is absent: a dialer has
  // nowhere to put a message.
  string channel_kind = 3;
  // subject applies to email templates only.
  string subject = 4;
  string body = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateMessageTemplateRequest {
  string name = 1;
  string channel_kind = 2;
  string subject = 3;
  string body = 4;
}
message CreateMessageTemplateResponse { MessageTemplate template = 1; }

message ListMessageTemplatesRequest {
  // channel_kind narrows the list; empty returns every channel's.
  string channel_kind = 1;
}
message ListMessageTemplatesResponse { repeated MessageTemplate templates = 1; }

message UpdateMessageTemplateRequest {
  string id = 1;
  string name = 2;
  string channel_kind = 3;
  string subject = 4;
  string body = 5;
}
message UpdateMessageTemplateResponse { MessageTemplate template = 1; }

message DeleteMessageTemplateRequest { string id = 1; }
message DeleteMessageTemplateResponse {}

message DescribeMessageTemplateCatalogRequest {}
message DescribeMessageTemplateCatalogResponse {
  repeated string channel_kinds = 1;
  // merge_fields are the only placeholders a body may name.
  repeated string merge_fields = 2;
}

// MessagingChannel is one address a contact can be reached at, with the
// gate's verdict already applied (internal/domain/messaging.go).
message MessagingChannel {
  // kind is one of: email, sms, voice, whatsapp.
  string kind = 1;
  // address is normalised — lower-cased for email, punctuation stripped and
  // country code required for the phone kinds.
  string address = 2;
  // reachable reports whether the address can be used on this channel at all,
  // before consent is considered. unreachable_reason says why not.
  bool reachable = 3;
  string unreachable_reason = 4;
  // may_message is domain.MayMessage's answer: reachable, not suppressed, and
  // not withdrawn. refusal_reason is a bounded code, never free text built
  // from a record — see the Refusal* constants in internal/domain.
  bool may_message = 5;
  string refusal_reason = 6;
  // consent_state is the newest recorded decision for this address, or empty
  // when nobody has recorded one. Empty means unknown, not refused.
  string consent_state = 7;
}

message ListContactChannelsRequest { string contact_id = 1; }
message ListContactChannelsResponse { repeated MessagingChannel channels = 1; }

// MessagingConsent is one immutable decision in the ledger.
message MessagingConsent {
  string id = 1;
  string channel_kind = 2;
  string address = 3;
  // state is "granted" or "withdrawn".
  string state = 4;
  // source is one of: manual, import, capture, inbound_keyword.
  string source = 5;
  // evidence is a reference to what we were shown — a form submission id, a
  // message id — never the message content itself.
  string evidence = 6;
  string recorded_by = 7;
  google.protobuf.Timestamp recorded_at = 8;
}

message RecordMessagingConsentRequest {
  string channel_kind = 1;
  string address = 2;
  string state = 3;
  string source = 4;
  string evidence = 5;
}
message RecordMessagingConsentResponse { MessagingConsent consent = 1; }

message ListMessagingConsentRequest {
  string channel_kind = 1;
  string address = 2;
}
message ListMessagingConsentResponse { repeated MessagingConsent consent = 1; }

// CustomValue carries one tenant-defined field value without weakening the
// type safety of the fixed CRM schema. Exact decimals remain strings rather
// than protobuf doubles, so currency and percent values never round in transit.
message CustomValue {
  oneof value {
    string text = 1;
    double number = 2;
    string decimal = 3;
    bool boolean = 4;
    google.protobuf.Timestamp timestamp = 5;
    string date = 6;
    string reference = 7;
    StringList text_list = 8;
  }
}

message StringList { repeated string values = 1; }

message CustomFieldConfig {
  repeated string options = 1;
  string lookup_object_type = 2;
  int32 scale = 3;
  string expression = 4;
  // Empty means every role. Non-empty lists name the AuthinCore role keys
  // permitted to see or edit this field; crm administrators always retain
  // access so a misconfiguration remains recoverable.
  repeated string visible_to_roles = 5;
  repeated string editable_to_roles = 6;
  // A bounded expression evaluated against the full custom-field document on
  // write. It must yield true; false rejects the write.
  string validation_expression = 7;
}

message CustomFieldDefinition {
  string id = 1;
  string object_type = 2;
  string field_key = 3;
  string label = 4;
  string data_type = 5;
  CustomFieldConfig config = 6;
  bool required = 7;
  google.protobuf.Timestamp archived_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateCustomFieldDefinitionRequest { CustomFieldDefinition definition = 1; }
message CreateCustomFieldDefinitionResponse { CustomFieldDefinition definition = 1; }
message GetCustomFieldDefinitionRequest { string id = 1; }
message GetCustomFieldDefinitionResponse { CustomFieldDefinition definition = 1; }
message ListCustomFieldDefinitionsRequest {
  string object_type = 1;
  bool include_archived = 2;
}
message ListCustomFieldDefinitionsResponse { repeated CustomFieldDefinition definitions = 1; }
message UpdateCustomFieldDefinitionRequest { CustomFieldDefinition definition = 1; }
message UpdateCustomFieldDefinitionResponse { CustomFieldDefinition definition = 1; }
message ArchiveCustomFieldDefinitionRequest { string id = 1; }
message ArchiveCustomFieldDefinitionResponse { CustomFieldDefinition definition = 1; }

message CustomObjectDefinition { string id = 1; string api_name = 2; string label = 3; string plural_label = 4; google.protobuf.Timestamp archived_at = 5; google.protobuf.Timestamp created_at = 6; google.protobuf.Timestamp updated_at = 7; }
message CustomRecord { string id = 1; string object_type = 2; map<string, CustomValue> fields = 3; map<string, string> relations = 4; google.protobuf.Timestamp created_at = 5; google.protobuf.Timestamp updated_at = 6; }
message CreateCustomObjectDefinitionRequest { CustomObjectDefinition definition = 1; }
message CreateCustomObjectDefinitionResponse { CustomObjectDefinition definition = 1; }
message GetCustomObjectDefinitionRequest { string api_name = 1; }
message GetCustomObjectDefinitionResponse { CustomObjectDefinition definition = 1; }
message ListCustomObjectDefinitionsRequest { bool include_archived = 1; }
message ListCustomObjectDefinitionsResponse { repeated CustomObjectDefinition definitions = 1; }
message ArchiveCustomObjectDefinitionRequest { string api_name = 1; }
message ArchiveCustomObjectDefinitionResponse { CustomObjectDefinition definition = 1; }
message CreateCustomRecordRequest { CustomRecord record = 1; }
message CreateCustomRecordResponse { CustomRecord record = 1; }
message GetCustomRecordRequest { string object_type = 1; string id = 2; }
message GetCustomRecordResponse { CustomRecord record = 1; }
message ListCustomRecordsRequest { string object_type = 1; int32 page_size = 2; string page_token = 3; }
message ListCustomRecordsResponse { repeated CustomRecord records = 1; string next_page_token = 2; }
message UpdateCustomRecordRequest { CustomRecord record = 1; }
message UpdateCustomRecordResponse { CustomRecord record = 1; }
message DeleteCustomRecordRequest { string object_type = 1; string id = 2; }
message DeleteCustomRecordResponse {}

message SearchRecordsRequest {
  // query must contain at least two non-space characters. It is interpreted as
  // literal text, never as a database expression or search-language fragment.
  string query = 1;
  // page_size is bounded by the server (maximum 50). Quick search intentionally
  // returns one ranked, capped result set; entity lists remain the pageable
  // surface for exhaustive browsing.
  int32 page_size = 2;
}
message SearchRecord {
  string object_type = 1;
  string id = 2;
  string title = 3;
  string subtitle = 4;
}
message SearchRecordsResponse { repeated SearchRecord records = 1; }

// ---------------------------------------------------------------------------
// Google connection
// ---------------------------------------------------------------------------

// GoogleConnection is the browser-facing projection of a stored connection.
// It is status, not credentials: there is deliberately no field here that a
// token, refresh token or PKCE verifier could be assigned to.
message GoogleConnection {
  string id = 1;
  // owner_id is the CRM principal whose Google account this is.
  string owner_id = 2;
  // google_account_email is read back from Google under the grant that was
  // just issued, not typed by the user, so authorizing the wrong account is
  // visible rather than silent.
  string google_account_email = 3;
  // status is connected | reauthorization_required | disconnected. An empty
  // status means this user has no connection at all, which is the normal
  // state and not an error.
  string status = 4;
  // granted_scopes is what Google returned, which may be narrower than what
  // was requested when the user granted partial consent.
  repeated string granted_scopes = 5;
  google.protobuf.Timestamp access_token_expires_at = 6;
  string connected_by = 7;
  google.protobuf.Timestamp connected_at = 8;
  google.protobuf.Timestamp last_refreshed_at = 9;
  google.protobuf.Timestamp disconnected_at = 10;
  // last_error is a bounded reason code, never a provider message.
  string last_error = 11;
}

message StartGoogleConnectionRequest {
  // return_path is where the callback sends the browser when it is done. It
  // must be a same-origin absolute path ("/settings/integrations"); anything
  // that a browser would resolve off-site is rejected rather than sanitized.
  string return_path = 1;
}
message StartGoogleConnectionResponse {
  // authorization_url is Google's consent screen, already carrying this
  // flow's one-time state and PKCE challenge. The state itself is never
  // returned separately — the client has no reason to read it, and the server
  // will not accept one it did not issue.
  string authorization_url = 1;
}

// GmailSyncStatus is how far synchronisation has got for one mailbox. It
// reports progress and health only: there is no field here that could hold a
// message, a participant, or a subject line.
message GmailSyncStatus {
  // backfill_complete reports whether the first pass over the sync window has
  // finished. Until it has, the CRM holds only part of the recent history.
  bool backfill_complete = 1;
  google.protobuf.Timestamp last_synced_at = 2;
  // last_message_at is the time of the newest message indexed. It is a more
  // honest "up to date as of" than last_synced_at, which only says a pass
  // ran.
  google.protobuf.Timestamp last_message_at = 3;
  // messages_indexed counts messages that matched a CRM contact. Messages
  // with no CRM counterparty are never recorded or counted.
  int64 messages_indexed = 4;
  int64 activities_created = 5;
  // last_error is a bounded reason code, never a provider message.
  string last_error = 6;
}

message GetGoogleConnectionRequest {}
message GetGoogleConnectionResponse {
  GoogleConnection connection = 1;
  // configured reports whether this deployment has Google credentials at all.
  // A CRM without them is running correctly and simply cannot offer the
  // feature, which the UI must state rather than showing a broken button.
  bool configured = 2;
  // requested_scopes is the consent the user is about to be asked for, taken
  // from the server so the UI cannot drift from what is actually requested.
  repeated string requested_scopes = 3;
  // gmail_sync is absent until the mailbox has been synced at least once.
  GmailSyncStatus gmail_sync = 4;
  // calendar_sync is absent until the calendar has been synced at least once.
  CalendarSyncStatus calendar_sync = 5;
}

message ListGoogleConnectionsRequest {}
message ListGoogleConnectionsResponse { repeated GoogleConnection connections = 1; }

message DisconnectGoogleConnectionRequest {
  // purge additionally deletes the connection record. Without it a
  // disconnected tombstone remains, which is what lets the audit trail answer
  // who ended the access and when.
  bool purge = 1;
}
message DisconnectGoogleConnectionResponse { GoogleConnection connection = 1; }

// CalendarSyncStatus is how far calendar synchronisation has got. Like its
// Gmail counterpart it reports progress and health only: no field here could
// hold a meeting, an attendee, or a title.
message CalendarSyncStatus {
  bool backfill_complete = 1;
  google.protobuf.Timestamp last_synced_at = 2;
  // last_event_at is the start of the latest event indexed, which for a
  // calendar is usually in the future. It is progress, not freshness.
  google.protobuf.Timestamp last_event_at = 3;
  // events_indexed counts events that matched a CRM contact. Events with no
  // CRM counterparty are never recorded or counted.
  int64 events_indexed = 4;
  // activities_created counts timeline entries: a meeting appearing, moving,
  // or being cancelled. It is much lower than events_indexed in steady state,
  // because most passes find nothing material has changed.
  int64 activities_created = 5;
  string last_error = 6;
}

message SyncGoogleCalendarRequest {}
message SyncGoogleCalendarResponse {
  CalendarSyncStatus calendar_sync = 1;
  int32 events_examined = 2;
  int32 entries_created = 3;
}

// ErasureResult reports what an erasure did. Counts only: a result that
// listed the subject lines it had just erased would be an odd thing to build.
message ErasureResult {
  int32 activities_deleted = 1;
  int32 messages_redacted = 2;
  int32 events_redacted = 3;
  int32 addresses_suppressed = 4;
}

message EraseSyncedContentForContactRequest {
  string contact_id = 1;
  // reason is an operator note recorded on the suppression and in the audit
  // event. It answers "why is this address here" months later.
  string reason = 2;
}
message EraseSyncedContentResponse { ErasureResult result = 1; }

// SyncSuppression is one address synchronisation must never match again.
message SyncSuppression {
  string address = 1;
  string reason = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ListSyncSuppressionsRequest {}
message ListSyncSuppressionsResponse { repeated SyncSuppression suppressions = 1; }

message SuppressSyncAddressRequest {
  string address = 1;
  string reason = 2;
}
message SuppressSyncAddressResponse {}

message ReleaseSyncAddressRequest { string address = 1; }
message ReleaseSyncAddressResponse {}

message SyncGoogleMailboxRequest {}
message SyncGoogleMailboxResponse {
  GmailSyncStatus gmail_sync = 1;
  // messages_examined counts envelopes fetched in this pass, most of which
  // will not have matched anything. It is reported so a user can see that
  // sync is working even when it records nothing.
  int32 messages_examined = 2;
  // entries_created counts timeline entries actually written by this pass.
  int32 entries_created = 3;
}

message Account {
  string id = 1;
  string name = 2;
  string industry = 3;
  string tier = 4;
  string owner_id = 5;
  string website = 6;
  double annual_revenue = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // parent_id names the parent Account in the account hierarchy. Empty means
  // this account has no parent. B3 (docs/customer-os/PLAN.md) validates this
  // on every create/update that sets it: the named parent must exist in this
  // tenant, and the parent chain must never loop back to this account.
  string parent_id = 10;
  // duplicate_of_account_id is set (by CreateAccount/UpdateAccount — see
  // internal/domain/account_hierarchy.go) when website's domain exactly
  // matches another tenant-scoped Account's website at write time. It flags
  // the account; it never blocks or silently merges it (B3).
  string duplicate_of_account_id = 11;
  map<string, CustomValue> custom_fields = 12;
}

message CreateAccountRequest { Account account = 1; }
message CreateAccountResponse { Account account = 1; }

message GetAccountRequest { string id = 1; }
message GetAccountResponse { Account account = 1; }

message ListAccountsRequest {
  int32 page_size = 1;
  string page_token = 2;
  // name_contains matches Account.name case-insensitively, substring anywhere.
  string name_contains = 3;
  // tier, when set, matches Account.tier exactly.
  string tier = 4;
  // owner_id, when set, matches Account.owner_id exactly (e.g. "my accounts").
  string owner_id = 5;
  // sort selects the result order: "" (default, Account.name ascending) or
  // "-created_at" (newest first). Any other value is rejected as invalid —
  // this is an allowlist, not a free-form column/expression.
  string sort = 6;
  // parent_id, when set, matches Account.parent_id exactly — lists the child
  // accounts of the named account.
  string parent_id = 7;
}
message ListAccountsResponse {
  repeated Account accounts = 1;
  string next_page_token = 2;
}

message UpdateAccountRequest { Account account = 1; }
message UpdateAccountResponse { Account account = 1; }

message DeleteAccountRequest { string id = 1; }
message DeleteAccountResponse {}

message Contact {
  string id = 1;
  string email = 2;
  // account_id must name an existing Account in this tenant (B4 —
  // docs/customer-os/PLAN.md, internal/domain/contact_integrity.go). A
  // dangling or cross-tenant account_id is rejected on both create and
  // update.
  string account_id = 3;
  string first_name = 4;
  string last_name = 5;
  string phone = 6;
  string title = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // role is this contact's role at the account: one of billing, technical,
  // decision_maker, other. Empty is allowed (role not yet known); a
  // non-empty value outside that set is rejected. Plain validated field, not
  // a workflow.
  string role = 10;
  // duplicate_of_contact_id is set (by CreateContact/UpdateContact — see
  // internal/domain/contact_integrity.go) when email exactly matches another
  // tenant-scoped Contact's email at write time. It flags the contact; it
  // never blocks or silently merges it (B4) — the same convention Lead and
  // Account use for their own duplicate flags.
  string duplicate_of_contact_id = 11;
  map<string, CustomValue> custom_fields = 12;
}

message CreateContactRequest { Contact contact = 1; }

syntax = "proto3";

package crm.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/santoshguru/crm/gen/crm/v1;crmv1";

// CRMService is the domain API. Every RPC is tenant-scoped: the tenant is taken
// from the caller's verified JWT, never from the request body.
service CRMService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);

  rpc CreateContact(CreateContactRequest) returns (CreateContactResponse);
  rpc GetContact(GetContactRequest) returns (GetContactResponse);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  rpc UpdateContact(UpdateContactRequest) returns (UpdateContactResponse);
  rpc DeleteContact(DeleteContactRequest) returns (DeleteContactResponse);

  rpc CreateLead(CreateLeadRequest) returns (CreateLeadResponse);
  rpc GetLead(GetLeadRequest) returns (GetLeadResponse);
  rpc ListLeads(ListLeadsRequest) returns (ListLeadsResponse);
  rpc UpdateLead(UpdateLeadRequest) returns (UpdateLeadResponse);
  rpc DeleteLead(DeleteLeadRequest) returns (DeleteLeadResponse);
  // ConvertLead is the load-bearing B1 operation (docs/customer-os/PLAN.md):
  // in one transaction it creates (or reuses, if the lead's email already
  // names one) a Contact, attaches it to an Account (existing match by email
  // domain, or a new one), optionally creates an Opportunity, and marks the
  // lead converted with the linked ids. Retrying with the same lead_id is a
  // no-op that returns the ids the first successful call produced.
  rpc ConvertLead(ConvertLeadRequest) returns (ConvertLeadResponse);

  rpc CreateOpportunity(CreateOpportunityRequest) returns (CreateOpportunityResponse);
  rpc GetOpportunity(GetOpportunityRequest) returns (GetOpportunityResponse);
  rpc ListOpportunities(ListOpportunitiesRequest) returns (ListOpportunitiesResponse);
  rpc UpdateOpportunity(UpdateOpportunityRequest) returns (UpdateOpportunityResponse);
  rpc DeleteOpportunity(DeleteOpportunityRequest) returns (DeleteOpportunityResponse);
  // Returns the append-only history for an opportunity. This is intentionally
  // separate from the mutable opportunity response so history remains useful
  // for audit and reporting clients.
  rpc ListOpportunityStageHistory(ListOpportunityStageHistoryRequest) returns (ListOpportunityStageHistoryResponse);

  // Pipeline configuration is organization administration data. These RPCs
  // manage definitions only; the later opportunity migration will bind each
  // deal to pipeline_id/stage_id without rewriting historical stage text.
  rpc CreatePipeline(CreatePipelineRequest) returns (CreatePipelineResponse);
  rpc GetPipeline(GetPipelineRequest) returns (GetPipelineResponse);
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse);
  rpc UpdatePipeline(UpdatePipelineRequest) returns (UpdatePipelineResponse);
  rpc CreatePipelineStage(CreatePipelineStageRequest) returns (CreatePipelineStageResponse);
  rpc ListPipelineStages(ListPipelineStagesRequest) returns (ListPipelineStagesResponse);
  rpc UpdatePipelineStage(UpdatePipelineStageRequest) returns (UpdatePipelineStageResponse);

  rpc CreateActivity(CreateActivityRequest) returns (CreateActivityResponse);
  rpc GetActivity(GetActivityRequest) returns (GetActivityResponse);
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse);
  rpc UpdateActivity(UpdateActivityRequest) returns (UpdateActivityResponse);
  rpc DeleteActivity(DeleteActivityRequest) returns (DeleteActivityResponse);
  // ListActivitiesForSubject is the B5 timeline query
  // (docs/customer-os/PLAN.md): every Activity attached to one polymorphic
  // subject (subject_type + subject_id), newest first by occurred_at.
  rpc ListActivitiesForSubject(ListActivitiesForSubjectRequest) returns (ListActivitiesForSubjectResponse);

  // Tasks and Notes are first-class entities, not Activity kinds.
  //
  // An Activity records what happened and is immutable once logged. A Task
  // records what should happen: it has a lifecycle, an assignee and a due
  // date, and it is edited repeatedly until it is done. A Note is authored
  // prose that gets corrected. Expressing either as an Activity would mean
  // making Activity mutable — destroying the property that makes it useful
  // for audit — or storing tasks that can never be completed.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  // CompleteTask and ReopenTask are separate from UpdateTask on purpose.
  // Ticking a checkbox should not require sending the whole record back:
  // that is a read-modify-write, and under optimistic concurrency it either
  // fails against a concurrent edit or silently clobbers one. Both are
  // idempotent — completing a completed task returns it unchanged.
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
  rpc ReopenTask(ReopenTaskRequest) returns (ReopenTaskResponse);

  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse);
  rpc GetNote(GetNoteRequest) returns (GetNoteResponse);
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);
  rpc UpdateNote(UpdateNoteRequest) returns (UpdateNoteResponse);
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse);

  // Custom-field definitions are tenant administration data. Values travel on
  // the shipped record messages above, but a definition is the authority for
  // their type, requiredness, picklist options, and lookup target.
  rpc CreateCustomFieldDefinition(CreateCustomFieldDefinitionRequest) returns (CreateCustomFieldDefinitionResponse);
  rpc GetCustomFieldDefinition(GetCustomFieldDefinitionRequest) returns (GetCustomFieldDefinitionResponse);
  rpc ListCustomFieldDefinitions(ListCustomFieldDefinitionsRequest) returns (ListCustomFieldDefinitionsResponse);
  rpc UpdateCustomFieldDefinition(UpdateCustomFieldDefinitionRequest) returns (UpdateCustomFieldDefinitionResponse);
  rpc ArchiveCustomFieldDefinition(ArchiveCustomFieldDefinitionRequest) returns (ArchiveCustomFieldDefinitionResponse);

  rpc CreateCustomObjectDefinition(CreateCustomObjectDefinitionRequest) returns (CreateCustomObjectDefinitionResponse);
  rpc GetCustomObjectDefinition(GetCustomObjectDefinitionRequest) returns (GetCustomObjectDefinitionResponse);
  rpc ListCustomObjectDefinitions(ListCustomObjectDefinitionsRequest) returns (ListCustomObjectDefinitionsResponse);
  rpc ArchiveCustomObjectDefinition(ArchiveCustomObjectDefinitionRequest) returns (ArchiveCustomObjectDefinitionResponse);
  rpc CreateCustomRecord(CreateCustomRecordRequest) returns (CreateCustomRecordResponse);
  rpc GetCustomRecord(GetCustomRecordRequest) returns (GetCustomRecordResponse);
  rpc ListCustomRecords(ListCustomRecordsRequest) returns (ListCustomRecordsResponse);
  rpc UpdateCustomRecord(UpdateCustomRecordRequest) returns (UpdateCustomRecordResponse);
  rpc DeleteCustomRecord(DeleteCustomRecordRequest) returns (DeleteCustomRecordResponse);

  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
}

// CustomValue carries one tenant-defined field value without weakening the
// type safety of the fixed CRM schema. Exact decimals remain strings rather
// than protobuf doubles, so currency and percent values never round in transit.
message CustomValue {
  oneof value {
    string text = 1;
    double number = 2;
    string decimal = 3;
    bool boolean = 4;
    google.protobuf.Timestamp timestamp = 5;
    string date = 6;
    string reference = 7;
    StringList text_list = 8;
  }
}

message StringList { repeated string values = 1; }

message CustomFieldConfig {
  repeated string options = 1;
  string lookup_object_type = 2;
  int32 scale = 3;
  string expression = 4;
  // Empty means every role. Non-empty lists name the AuthinCore role keys
  // permitted to see or edit this field; crm administrators always retain
  // access so a misconfiguration remains recoverable.
  repeated string visible_to_roles = 5;
  repeated string editable_to_roles = 6;
  // A bounded expression evaluated against the full custom-field document on
  // write. It must yield true; false rejects the write.
  string validation_expression = 7;
}

message CustomFieldDefinition {
  string id = 1;
  string object_type = 2;
  string field_key = 3;
  string label = 4;
  string data_type = 5;
  CustomFieldConfig config = 6;
  bool required = 7;
  google.protobuf.Timestamp archived_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateCustomFieldDefinitionRequest { CustomFieldDefinition definition = 1; }
message CreateCustomFieldDefinitionResponse { CustomFieldDefinition definition = 1; }
message GetCustomFieldDefinitionRequest { string id = 1; }
message GetCustomFieldDefinitionResponse { CustomFieldDefinition definition = 1; }
message ListCustomFieldDefinitionsRequest {
  string object_type = 1;
  bool include_archived = 2;
}
message ListCustomFieldDefinitionsResponse { repeated CustomFieldDefinition definitions = 1; }
message UpdateCustomFieldDefinitionRequest { CustomFieldDefinition definition = 1; }
message UpdateCustomFieldDefinitionResponse { CustomFieldDefinition definition = 1; }
message ArchiveCustomFieldDefinitionRequest { string id = 1; }
message ArchiveCustomFieldDefinitionResponse { CustomFieldDefinition definition = 1; }

message CustomObjectDefinition { string id = 1; string api_name = 2; string label = 3; string plural_label = 4; google.protobuf.Timestamp archived_at = 5; google.protobuf.Timestamp created_at = 6; google.protobuf.Timestamp updated_at = 7; }
message CustomRecord { string id = 1; string object_type = 2; map<string, CustomValue> fields = 3; map<string, string> relations = 4; google.protobuf.Timestamp created_at = 5; google.protobuf.Timestamp updated_at = 6; }
message CreateCustomObjectDefinitionRequest { CustomObjectDefinition definition = 1; }
message CreateCustomObjectDefinitionResponse { CustomObjectDefinition definition = 1; }
message GetCustomObjectDefinitionRequest { string api_name = 1; }
message GetCustomObjectDefinitionResponse { CustomObjectDefinition definition = 1; }
message ListCustomObjectDefinitionsRequest { bool include_archived = 1; }
message ListCustomObjectDefinitionsResponse { repeated CustomObjectDefinition definitions = 1; }
message ArchiveCustomObjectDefinitionRequest { string api_name = 1; }
message ArchiveCustomObjectDefinitionResponse { CustomObjectDefinition definition = 1; }
message CreateCustomRecordRequest { CustomRecord record = 1; }
message CreateCustomRecordResponse { CustomRecord record = 1; }
message GetCustomRecordRequest { string object_type = 1; string id = 2; }
message GetCustomRecordResponse { CustomRecord record = 1; }
message ListCustomRecordsRequest { string object_type = 1; int32 page_size = 2; string page_token = 3; }
message ListCustomRecordsResponse { repeated CustomRecord records = 1; string next_page_token = 2; }
message UpdateCustomRecordRequest { CustomRecord record = 1; }
message UpdateCustomRecordResponse { CustomRecord record = 1; }
message DeleteCustomRecordRequest { string object_type = 1; string id = 2; }
message DeleteCustomRecordResponse {}

message Account {
  string id = 1;
  string name = 2;
  string industry = 3;
  string tier = 4;
  string owner_id = 5;
  string website = 6;
  double annual_revenue = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // parent_id names the parent Account in the account hierarchy. Empty means
  // this account has no parent. B3 (docs/customer-os/PLAN.md) validates this
  // on every create/update that sets it: the named parent must exist in this
  // tenant, and the parent chain must never loop back to this account.
  string parent_id = 10;
  // duplicate_of_account_id is set (by CreateAccount/UpdateAccount — see
  // internal/domain/account_hierarchy.go) when website's domain exactly
  // matches another tenant-scoped Account's website at write time. It flags
  // the account; it never blocks or silently merges it (B3).
  string duplicate_of_account_id = 11;
  map<string, CustomValue> custom_fields = 12;
}

message CreateAccountRequest { Account account = 1; }
message CreateAccountResponse { Account account = 1; }

message GetAccountRequest { string id = 1; }
message GetAccountResponse { Account account = 1; }

message ListAccountsRequest {
  int32 page_size = 1;
  string page_token = 2;
  // name_contains matches Account.name case-insensitively, substring anywhere.
  string name_contains = 3;
  // tier, when set, matches Account.tier exactly.
  string tier = 4;
  // owner_id, when set, matches Account.owner_id exactly (e.g. "my accounts").
  string owner_id = 5;
  // sort selects the result order: "" (default, Account.name ascending) or
  // "-created_at" (newest first). Any other value is rejected as invalid —
  // this is an allowlist, not a free-form column/expression.
  string sort = 6;
  // parent_id, when set, matches Account.parent_id exactly — lists the child
  // accounts of the named account.
  string parent_id = 7;
}
message ListAccountsResponse {
  repeated Account accounts = 1;
  string next_page_token = 2;
}

message UpdateAccountRequest { Account account = 1; }
message UpdateAccountResponse { Account account = 1; }

message DeleteAccountRequest { string id = 1; }
message DeleteAccountResponse {}

message Contact {
  string id = 1;
  string email = 2;
  // account_id must name an existing Account in this tenant (B4 —
  // docs/customer-os/PLAN.md, internal/domain/contact_integrity.go). A
  // dangling or cross-tenant account_id is rejected on both create and
  // update.
  string account_id = 3;
  string first_name = 4;
  string last_name = 5;
  string phone = 6;
  string title = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // role is this contact's role at the account: one of billing, technical,
  // decision_maker, other. Empty is allowed (role not yet known); a
  // non-empty value outside that set is rejected. Plain validated field, not
  // a workflow.
  string role = 10;
  // duplicate_of_contact_id is set (by CreateContact/UpdateContact — see
  // internal/domain/contact_integrity.go) when email exactly matches another
  // tenant-scoped Contact's email at write time. It flags the contact; it
  // never blocks or silently merges it (B4) — the same convention Lead and
  // Account use for their own duplicate flags.
  string duplicate_of_contact_id = 11;
  map<string, CustomValue> custom_fields = 12;
}

message CreateContactRequest { Contact contact = 1; }
message CreateContactResponse { Contact contact = 1; }

message GetContactRequest { string id = 1; }
message GetContactResponse { Contact contact = 1; }

message ListContactsRequest {
  int32 page_size = 1;
  string page_token = 2;
  // account_id, when set, matches Contact.account_id exactly — the
  // "contacts of this account" query an account detail page needs.
  string account_id = 3;
  // name_contains matches Contact.first_name or last_name case-insensitively.
  string name_contains = 4;
  // email_contains matches Contact.email case-insensitively, substring anywhere.
  string email_contains = 5;
  // sort selects the result order: "" (default, newest first) or "email"
  // (ascending). Any other value is rejected as invalid — an allowlist, not
  // a free-form column/expression.
  string sort = 6;
}
message ListContactsResponse {
  repeated Contact contacts = 1;
  string next_page_token = 2;
}

message UpdateContactRequest { Contact contact = 1; }
message UpdateContactResponse { Contact contact = 1; }

message DeleteContactRequest { string id = 1; }
message DeleteContactResponse {}

message Lead {
  string id = 1;
  string company = 2;
  string source = 3;
  string contact_email = 4;
  // status is one of new, working, qualified, converted, disqualified (B1's
  // lifecycle state machine — internal/domain/lead_lifecycle.go).
  // converted/disqualified are terminal.
  string status = 5;
  int64 score = 6;
  string owner_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // duplicate_of_contact_id is set when contact_email exactly matches an
  // existing Contact at write time. The lead is still created/stored — this
  // only flags it, it never blocks or silently merges.
  string duplicate_of_contact_id = 10;
  // The following three are populated once, by ConvertLead, the instant this
  // lead converts. Empty until then. UpdateLead cannot set status to
  // converted directly or populate these — only ConvertLead may.
  string converted_contact_id = 11;
  string converted_account_id = 12;
  string converted_opportunity_id = 13;
  map<string, CustomValue> custom_fields = 14;
}

message CreateLeadRequest { Lead lead = 1; }
message CreateLeadResponse { Lead lead = 1; }

message GetLeadRequest { string id = 1; }
message GetLeadResponse { Lead lead = 1; }

message ListLeadsRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message ListLeadsResponse {
  repeated Lead leads = 1;
  string next_page_token = 2;
}

message UpdateLeadRequest { Lead lead = 1; }
message UpdateLeadResponse { Lead lead = 1; }

message DeleteLeadRequest { string id = 1; }
message DeleteLeadResponse {}

message ConvertLeadRequest {
  string lead_id = 1;
  // create_opportunity is a flag, not the default: an Opportunity is only
  // created when the caller asks for one.
  bool create_opportunity = 2;
  // opportunity_name/opportunity_amount are used only when
  // create_opportunity is true. opportunity_name defaults to
  // "<lead.company> opportunity" when left blank.
  string opportunity_name = 3;
  double opportunity_amount = 4;
}
message ConvertLeadResponse {
  Lead lead = 1;
  Contact contact = 2;
  Account account = 3;
  // opportunity is unset when the request did not ask for one.
  Opportunity opportunity = 4;
}

message Opportunity {
  string id = 1;
  string name = 2;
  string account_id = 3;
  string stage = 4;
  double amount = 5;
  double probability = 6;
  google.protobuf.Timestamp close_date = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // close_reason records why the opportunity closed (won/lost detail), for
  // forecasting and win/loss reporting. Not enforced against stage yet — that
  // is Track B.
  string close_reason = 10;
  // Tenant-owned pipeline and stage identifiers. `stage` remains a human-
  // readable compatibility field for older clients and historical reports.
  string pipeline_id = 11;
  string stage_id = 12;
  map<string, CustomValue> custom_fields = 13;
}

message CreateOpportunityRequest { Opportunity opportunity = 1; }
message CreateOpportunityResponse { Opportunity opportunity = 1; }

message GetOpportunityRequest { string id = 1; }
message GetOpportunityResponse { Opportunity opportunity = 1; }

message ListOpportunitiesRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message ListOpportunitiesResponse {
  repeated Opportunity opportunities = 1;
  string next_page_token = 2;
}

message UpdateOpportunityRequest { Opportunity opportunity = 1; }
message UpdateOpportunityResponse { Opportunity opportunity = 1; }

message DeleteOpportunityRequest { string id = 1; }
message DeleteOpportunityResponse {}

message OpportunityStageChange {
  string id = 1;
  string opportunity_id = 2;
  string from_stage = 3;
  string to_stage = 4;
  google.protobuf.Timestamp changed_at = 5;
}
message ListOpportunityStageHistoryRequest { string opportunity_id = 1; }
message ListOpportunityStageHistoryResponse { repeated OpportunityStageChange changes = 1; }

message Pipeline {
  string id = 1;
  string name = 2;
  bool is_default = 3;
  google.protobuf.Timestamp archived_at = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreatePipelineRequest { Pipeline pipeline = 1; }
message CreatePipelineResponse { Pipeline pipeline = 1; }
message GetPipelineRequest { string id = 1; }
message GetPipelineResponse { Pipeline pipeline = 1; }
message ListPipelinesRequest {}
message ListPipelinesResponse { repeated Pipeline pipelines = 1; }
message UpdatePipelineRequest { Pipeline pipeline = 1; }
message UpdatePipelineResponse { Pipeline pipeline = 1; }

message PipelineStage {
  string id = 1;
  string pipeline_id = 2;
  string name = 3;
  int32 position = 4;
  double probability = 5;
  // open, won, or lost. Terminal stages retain their data rather than being
  // deleted, so historical reporting remains explainable.
  string terminal_type = 6;
  bool requires_close_reason = 7;
  google.protobuf.Timestamp archived_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreatePipelineStageRequest { PipelineStage stage = 1; }
message CreatePipelineStageResponse { PipelineStage stage = 1; }
message ListPipelineStagesRequest { string pipeline_id = 1; }
message ListPipelineStagesResponse { repeated PipelineStage stages = 1; }
message UpdatePipelineStageRequest { PipelineStage stage = 1; }
message UpdatePipelineStageResponse { PipelineStage stage = 1; }

message Activity {
  string id = 1;
  string kind = 2;
  // subject_type + subject_id are Activity's polymorphic edge (B5 —
  // docs/customer-os/PLAN.md, internal/domain/activity_timeline.go):
  // subject_type is one of account, contact, lead, opportunity, and
  // subject_id must name an existing record of that type in this tenant. An
  // unrecognized subject_type or a dangling/cross-tenant subject_id is
  // rejected on create.
  string subject_type = 3;
  string subject_id = 4;
  string notes = 5;
  string actor_id = 6;
  google.protobuf.Timestamp occurred_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  map<string, CustomValue> custom_fields = 10;
}

message CreateActivityRequest { Activity activity = 1; }
message CreateActivityResponse { Activity activity = 1; }

message GetActivityRequest { string id = 1; }
message GetActivityResponse { Activity activity = 1; }

message ListActivitiesRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message ListActivitiesResponse {
  repeated Activity activities = 1;
  string next_page_token = 2;
}

// UpdateActivityRequest replaces an existing Activity. Activity is immutable
// once logged (B5 — docs/customer-os/PLAN.md): a request that would actually
// change kind, subject_type, subject_id, notes, actor_id or occurred_at is
// rejected. A request that repeats the record's current values is accepted
// as a no-op. A correction is a new Activity, never an edit of this one.
message UpdateActivityRequest { Activity activity = 1; }
message UpdateActivityResponse { Activity activity = 1; }

message DeleteActivityRequest { string id = 1; }
message DeleteActivityResponse {}

// ListActivitiesForSubjectRequest names one polymorphic subject; both fields
// are required.
message ListActivitiesForSubjectRequest {
  string subject_type = 1;
  string subject_id = 2;
}
// ListActivitiesForSubjectResponse returns every Activity attached to the
// named subject, newest first by occurred_at. Unpaginated, the same
// convention ListStageHistory/ListOwnershipHistory use for a bounded,
// append-only-per-parent history list.
message ListActivitiesForSubjectResponse {
  repeated Activity activities = 1;
}

message GetSummaryRequest {}
message GetSummaryResponse {
  int64 total = 1;
  map<string, int64> counts = 2;
}

// ---------------------------------------------------------------------------
// Task
// ---------------------------------------------------------------------------

// Task is a unit of work someone is expected to do. Unlike Activity it is
// mutable and has a lifecycle; unlike Opportunity its terminal states are
// reversible, because a task that turns out not to be finished is reopened
// rather than replaced — replacing it would lose the record of what was
// originally asked and when.
message Task {
  string id = 1;
  string title = 2;
  string description = 3;
  // status is one of: open, in_progress, completed, cancelled.
  string status = 4;
  // priority is one of: low, normal, high, urgent. Empty means normal.
  string priority = 5;
  // assignee_id is the identity expected to do the work. Empty is allowed:
  // an unassigned task is a real state, not a validation failure.
  string assignee_id = 6;
  // due_at is optional. A task with no due date is never overdue.
  google.protobuf.Timestamp due_at = 7;
  // subject_type + subject_id optionally attach this task to one CRM record,
  // using the same polymorphic edge Activity uses (account, contact, lead,
  // opportunity). Both empty means a standalone task. Setting one without
  // the other is rejected.
  string subject_type = 8;
  string subject_id = 9;
  // completed_at and completed_by are set by CompleteTask and cleared by
  // ReopenTask. They are never writable directly.
  google.protobuf.Timestamp completed_at = 10;
  string completed_by = 11;
  string created_by = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  map<string, CustomValue> custom_fields = 15;
}

message CreateTaskRequest { Task task = 1; }
message CreateTaskResponse { Task task = 1; }
message GetTaskRequest { string id = 1; }
message GetTaskResponse { Task task = 1; }

message ListTasksRequest {
  int32 page_size = 1;
  string page_token = 2;
  // assignee_id, when set, matches Task.assignee_id exactly ("my tasks").
  string assignee_id = 3;
  // status, when set, matches Task.status exactly.
  string status = 4;
  // subject_type + subject_id, when both set, list the tasks attached to one
  // record. Setting one without the other is rejected.
  string subject_type = 5;
  string subject_id = 6;
  // open_only excludes completed and cancelled tasks. It exists separately
  // from status because "still to do" spans two statuses, and making every
  // caller send two requests to answer the most common question would be a
  // poor contract.
  bool open_only = 7;
  // due_before, when set, matches tasks whose due_at is strictly earlier.
  // Combined with open_only this is the overdue list.
  google.protobuf.Timestamp due_before = 8;
  // sort selects the order: "" (default, due date ascending with undated
  // tasks last) or "-created_at" (newest first). An allowlist, not a column.
  string sort = 9;
}
message ListTasksResponse {
  repeated Task tasks = 1;
  string next_page_token = 2;
}

message UpdateTaskRequest { Task task = 1; }
message UpdateTaskResponse { Task task = 1; }
message DeleteTaskRequest { string id = 1; }
message DeleteTaskResponse {}

// CompleteTaskRequest marks a task done. actor_id records who completed it;
// when empty the server uses the calling principal.
message CompleteTaskRequest {
  string id = 1;
  string actor_id = 2;
}
message CompleteTaskResponse { Task task = 1; }
message ReopenTaskRequest { string id = 1; }
message ReopenTaskResponse { Task task = 1; }

// ---------------------------------------------------------------------------
// Note
// ---------------------------------------------------------------------------

// Note is authored prose about one CRM record. It is deliberately mutable:
// a note is a working document that gets corrected, which is exactly why it
// cannot be an Activity — Activity's value comes from being immutable.
message Note {
  string id = 1;
  // body is the note's text. Required.
  string body = 2;
  // subject_type + subject_id are required: a note is always about
  // something. The same polymorphic edge Activity and Task use.
  string subject_type = 3;
  string subject_id = 4;
  string author_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // edited_at is set the first time the body actually changes, and left
  // alone by a write that changes nothing. A reader can tell a corrected
  // note from an original one without diffing anything.
  google.protobuf.Timestamp edited_at = 8;
  map<string, CustomValue> custom_fields = 9;
}

message CreateNoteRequest { Note note = 1; }
message CreateNoteResponse { Note note = 1; }
message GetNoteRequest { string id = 1; }
message GetNoteResponse { Note note = 1; }

message ListNotesRequest {
  int32 page_size = 1;
  string page_token = 2;
  // subject_type + subject_id, when both set, list the notes on one record.
  string subject_type = 3;
  string subject_id = 4;
  // author_id, when set, matches Note.author_id exactly.
  string author_id = 5;
}
message ListNotesResponse {
  repeated Note notes = 1;
  string next_page_token = 2;
}

message UpdateNoteRequest { Note note = 1; }
message UpdateNoteResponse { Note note = 1; }
message DeleteNoteRequest { string id = 1; }
message DeleteNoteResponse {}

#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - docker.io
  - docker-compose-v2
  - openssl
  - python3

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker savvyops
  - systemctl enable --now unattended-upgrades.service

final_message: "Savvy CRM base VM provisioning complete"

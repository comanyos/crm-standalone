name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # compose.yaml declares CRM_WEB_AUTH_ORG_ID with `:?` so a real `make up`
      # fails loudly rather than building the web image with an empty public
      # OIDC organization id. That guard also makes `docker compose config`
      # fail on a clean checkout, where no operator has run `make bootstrap`.
      # Validation only needs *a* syntactically valid value, so supply a
      # placeholder here — the guard still protects every real deployment.
      - name: Validate Compose config
        env:
          CRM_WEB_AUTH_ORG_ID: 00000000-0000-0000-0000-000000000000
        run: docker compose config --quiet

  # The backup and restore scripts addressed a `crm` role that has never
  # existed, so neither had ever run successfully against the CRM database.
  # This exercises their real pipelines — pg_dump, gzip, age, psql — against a
  # throwaway cluster, and asserts both that a wrong age identity destroys
  # nothing and that the application roles keep their grants across a restore.
  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Backup/restore round trip
        run: ./scripts/test-backup-restore.sh

  crm-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/crm-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/crm-api/go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "gofmt found unformatted files (run 'make fmt')"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/crm-api
          version: latest
      - name: build
        run: go build ./...
      # The PostgreSQL tier — row-level security, tenant isolation, the
      # transaction and row-lock behaviour of the revenue workflows — skips
      # itself when no database is reachable. This job started none, so all of
      # it skipped on every pull request while CI reported green. Bring up the
      # repository's own disposable instance, the same one `make test-db-up`
      # starts, so CI and a developer's machine run the same tier against the
      # same schema.
      #
      # Compose, rather than a bare `services:` container, because
      # crm-postgres-test mounts migrations/ as initdb.d: the schema and the
      # crm_app/crm_drain roles exist before the first test connects. Without
      # that, internal/server (which runs no DDL of its own and checks the
      # catalog) could reach its check before internal/domain has applied the
      # migrations — the two packages run as concurrent processes — and now
      # that a missing schema is fatal rather than skipped, that race would be
      # a flaky red instead of a silent green.
      #
      # CRM_WEB_AUTH_ORG_ID is compose's `:?` guard on an unrelated service;
      # `docker compose` parses the whole file whatever you ask it to start,
      # so supply the same placeholder the compose-config job uses.
      - name: Start the test database
        env:
          CRM_WEB_AUTH_ORG_ID: 00000000-0000-0000-0000-000000000000
        working-directory: .
        run: docker compose --profile test up -d --wait crm-postgres-test
      - name: test
        env:
          TEST_DATABASE_URL: postgres://postgres:crm_admin_test@localhost:15533/crm?sslmode=disable
          # Without this a database that fails to start puts the tier straight
          # back to skipping, and the run back to a green that proves nothing.
          REQUIRE_LIVE_POSTGRES: "1"
        run: go test -race -cover ./...

  authincore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/authincore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/authincore/go.mod
      # cmd/authincore embeds hosted-ui/dist via `//go:embed all:dist`, and
      # dist/ is gitignored build output. Without this step every Go command
      # that loads those packages fails with "pattern all:dist: no matching
      # files found" — build, vet and test alike. `make test` builds it via
      # the auth-ui target; CI has to do the same.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/authincore/hosted-ui/package-lock.json
      - name: build hosted login UI (embedded by cmd/authincore)
        working-directory: services/authincore/hosted-ui
        run: npm ci && npm run build
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "gofmt found unformatted files (run 'make fmt')"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      # NOTE: informational only until the pre-existing lint backlog in this
      # service (~90 issues predating this CI setup, see CONTRIBUTING.md) is
      # triaged and fixed. Do not remove continue-on-error silently — flip it
      # off only once golangci-lint run ./... is clean here too.
      - uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        with:
          working-directory: services/authincore
          version: latest
      - name: build
        run: go build ./cmd/...
      # Same reasoning as the crm-api job: cmd/authinctl's bootstrap tier is a
      # live-database tier that skips itself, so CI has to provide the
      # database and refuse to accept a skip.
      - name: Start the test database
        env:
          CRM_WEB_AUTH_ORG_ID: 00000000-0000-0000-0000-000000000000
        working-directory: .
        run: docker compose --profile test up -d --wait auth-postgres-test
      - name: test
        env:
          AUTH_TEST_DATABASE_URL: postgres://authincore:authincore_test@localhost:15532/authincore?sslmode=disable
          REQUIRE_LIVE_POSTGRES: "1"
        run: go test -race -cover ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: install (npm workspace root)
        run: npm ci
      # packages/contracts/gen/ is committed generated code (see
      # CONTRIBUTING.md's generated-code policy) — consumed as-is here, the
      # same way crm-api's Go job below never re-runs `buf generate` either.
      - name: typecheck + build
        run: npm run build --workspace=@crm/web
      - name: lint
        run: npm run lint --workspace=@crm/web
      - name: unit tests
        run: npm run test --workspace=@crm/web
      - name: auth-client unit tests
        run: npm run test --workspace=@crm/auth-client
      # Browser tests (npm run test:e2e --workspace=@crm/web) need the full
      # backend stack up and bootstrapped — not run in this job. See
      # apps/web/README.md and CONTRIBUTING.md's test-tiers section.
